<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>実験ラボ3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="化学の実験器具を3Dで見て、使い方を練習できるアプリ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Lexend:wght@400;500;600&display=swap">
<style>
/* レイアウト：左に器具の棚、右に3Dの実験台。説明と操作パネルは実験台の中 */
:root {
  --bg: #eef1f4; --panel: #ffffff; --glass: rgba(255, 255, 255, 0.94); --ink: #172231; --muted: #5b6676; --line: #d6dce4; --chip: #e8edf2;
  --accent: #0f7a6e; --accent-ink: #ffffff; --warm: #d9661f; --ok: #1f8a5b; --ng: #d33a2c;
  --bench-1: #f7f8fa; --bench-2: #d7dde4;
  --font-display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-data: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --r: 12px; --card-w: 370px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1218; --panel: #131c25; --glass: rgba(19, 28, 37, 0.93); --ink: #e6edf3; --muted: #97a3b2; --line: #263240; --chip: #1c2833;
    --accent: #3cc4b2; --accent-ink: #0c1218; --warm: #ffa04d; --ok: #4fd19a; --ng: #ff6b5e; --bench-1: #1b2631; --bench-2: #070b10; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1218; --panel: #131c25; --glass: rgba(19, 28, 37, 0.93); --ink: #e6edf3; --muted: #97a3b2; --line: #263240; --chip: #1c2833;
  --accent: #3cc4b2; --accent-ink: #0c1218; --warm: #ffa04d; --ok: #4fd19a; --ng: #ff6b5e; --bench-1: #1b2631; --bench-2: #070b10; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; display: flex; flex-direction: column; overflow: hidden; margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
sub, sup { font-size: .68em; line-height: 0; }
.top { display: flex; align-items: center; gap: 14px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 20px; margin: 0; white-space: nowrap; }
.brand b { color: var(--accent); }
.modes { display: flex; gap: 2px; }
.modes button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-size: 15px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.modes button[aria-current="true"] { background: var(--ink); color: var(--panel); }
.back { margin-left: auto; font-size: 13px; color: var(--accent); text-decoration: none; white-space: nowrap; }
.app { flex: 1; min-height: 0; display: grid; gap: 12px; grid-template-columns: 250px minmax(0, 1fr); padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lib { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow-y: auto; padding: 10px; min-width: 0; }
.grp { font-size: 11px; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin: 10px 4px 4px; }
.grp:first-child { margin-top: 2px; }
.item { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 9px; padding: 6px 8px; font-size: 14px; }
.item:hover { background: var(--chip); }
.item[aria-current="true"] { background: var(--chip); border-color: var(--accent); font-weight: 700; }
.item .ic { width: 22px; height: 22px; border-radius: 6px; background: var(--chip); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--accent); flex: none; font-family: var(--font-data); }
.item[aria-current="true"] .ic { background: var(--accent); color: var(--accent-ink); }
.item .done { margin-left: auto; color: var(--ok); font-weight: 700; }
.stage-wrap { position: relative; border-radius: var(--r); overflow: hidden; min-height: 0; border: 1px solid var(--line); background: radial-gradient(120% 90% at 40% 30%, var(--bench-1), var(--bench-2)); }
.stage-wrap.is-max { position: fixed; inset: 0; z-index: 50; border-radius: 0; }
#stage { position: absolute; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; font-size: 12.5px; font-weight: 700; color: var(--ink); background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
.lbl::before { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 10px; background: var(--muted); }
.lbl.warn { background: var(--ng); color: #fff; border-color: var(--ng); }
.ov { position: absolute; z-index: 2; display: flex; gap: 6px; }
.ov-tl { top: 10px; left: 10px; }
.ov-tr { top: 10px; right: 10px; }
.ibtn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
.ibtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tgl { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 0 12px; height: 36px; font-size: 13px; }
.tgl[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.toast { position: absolute; z-index: 4; left: 50%; top: 56px; transform: translateX(-50%); max-width: min(560px, calc(100% - 40px)); padding: 8px 14px; border-radius: 12px; font-weight: 700; font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.18); text-align: center; text-wrap: balance; transition: opacity .3s; }
.toast.ok { background: var(--ok); color: #fff; } .toast.ng { background: var(--ng); color: #fff; } .toast.info { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
.card { position: absolute; z-index: 3; top: 56px; right: 10px; bottom: 10px; width: var(--card-w); max-width: 50%; background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; overflow: hidden; backdrop-filter: blur(6px); }
.card-head { padding: 10px 14px 4px; }
.eyebrow { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.name { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.25; margin: 2px 0 0; }
.yomi { font-size: 12px; color: var(--muted); font-family: var(--font-data); }
.tabs { display: flex; gap: 2px; margin: 6px 14px 0; border-bottom: 1px solid var(--line); }
.tabs button { white-space: nowrap; border: 0; background: transparent; padding: 5px 9px; font-size: 13px; font-weight: 700; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.body { overflow-y: auto; padding: 10px 14px 14px; flex: 1; min-height: 0; }
.use { margin: 0 0 8px; font-size: 14.5px; }
ol.how { margin: 0; padding-left: 22px; font-size: 14px; }
ol.how li { margin-bottom: 4px; }
ul.caution { list-style: none; margin: 0; padding: 0; font-size: 14px; }
ul.caution li { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); }
ul.caution li b { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; color: #fff; margin-top: 2px; }
ul.caution li b.o { background: var(--ok); } ul.caution li b.x { background: var(--ng); }
.parts { display: flex; flex-wrap: wrap; gap: 4px; }
.parts span { font-size: 12.5px; background: var(--chip); border-radius: 6px; padding: 1px 8px; }
.ctl { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 12px; font-size: 14px; font-weight: 700; }
.btn:not(:disabled):hover { border-color: var(--accent); }
.btn.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.bad { color: var(--ng); }
.btn[aria-pressed="true"] { border-color: var(--accent); background: var(--chip); color: var(--accent); }
.sl { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 3.4em; gap: 8px; align-items: center; font-size: 13.5px; }
.sl input { accent-color: var(--accent); width: 100%; }
.sl output { font-family: var(--font-data); font-size: 13px; text-align: right; }
.checklist { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
.checklist li { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; color: var(--muted); }
.checklist li::before { content: ""; flex: none; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); margin-top: 3px; }
.checklist li.done { color: var(--ink); }
.checklist li.done::before { background: var(--ok); border-color: var(--ok); }
.checklist li.now { color: var(--ink); font-weight: 700; }
.checklist li.now::before { border-color: var(--accent); }
.verdict { border-radius: 10px; padding: 8px 10px; font-weight: 700; font-size: 14px; background: var(--chip); border-left: 4px solid var(--warm); }
.verdict.ok { border-left-color: var(--ok); color: var(--ok); }
.verdict.ng { border-left-color: var(--ng); color: var(--ng); }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
.readin { display: flex; gap: 8px; align-items: center; }
.readin input { width: 7em; font-family: var(--font-data); font-size: 18px; font-weight: 600; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
.qtext { font-size: 17px; font-weight: 700; line-height: 1.55; margin: 2px 0 8px; }
.qchoices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.qc { border: 1.5px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 8px; font-size: 15px; font-weight: 700; min-height: 46px; }
.qc.right { background: var(--ok); color: #fff; border-color: var(--ok); } .qc.wrong { color: var(--ng); border-color: var(--ng); } .qc.dim { opacity: .5; }
.qprog { height: 5px; border-radius: 999px; background: var(--chip); overflow: hidden; margin: 6px 0; }
.qprog i { display: block; height: 100%; background: var(--accent); }
.purpose { background: var(--chip); border-left: 3px solid var(--accent); border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: 14px; line-height: 1.65; }
.purpose > b:first-child { display: block; font-size: 12px; color: var(--accent); }
.purpose b { color: var(--accent); }
ol.whysteps { margin: 6px 0 0; padding-left: 22px; font-size: 14px; }
ol.whysteps li { margin-bottom: 8px; }
ol.whysteps li b { display: block; }
ol.whysteps li span { display: block; color: var(--muted); font-size: 13px; line-height: 1.6; }
ul.caution.danger li b.x { background: #b7791f; }
.gtab { width: 100%; border-collapse: collapse; font-size: 13px; margin: 2px 0; }
.gtab th { text-align: left; font-weight: 500; color: var(--muted); padding: 3px 8px 3px 0; white-space: nowrap; vertical-align: top; }
.gtab td { padding: 3px 0; }
.gtab tr + tr > * { border-top: 1px solid var(--line); }
.gtab .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.elecv { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; background: var(--chip); border-radius: 10px; padding: 6px 10px; }
.elecv b { font-family: var(--font-data); font-size: 17px; }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }
@media (max-width: 900px) {
  body { overflow: auto; height: auto; min-height: 100%; }
  .app { display: flex; flex-direction: column; }
  .lib { display: flex; gap: 6px; overflow-x: auto; padding: 8px; align-items: center; }
  .lib .note { display: none; }
  .grp { display: none; }
  .item { flex: 0 0 auto; width: auto; white-space: nowrap; border-color: var(--line); }
  .stage-wrap { height: 88vh; height: 88svh; min-height: 540px; }
  .card { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-width: none; max-height: 50%; }
  .modes button { padding: 5px 10px; font-size: 14px; }
  .top { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<header class="top">
  <h1 class="brand">実験ラボ<b>3D</b></h1>
  <nav class="modes" id="modes" aria-label="モード">
    <button type="button" data-mode="see" aria-current="true">器具を見る</button>
    <button type="button" data-mode="practice" aria-current="false">操作の練習</button>
    <button type="button" data-mode="quiz" aria-current="false">クイズ</button>
  </nav>
  <a class="back" id="backLink" href="index.html" target="_blank" rel="noopener">分子ラボ3D を開く ↗</a>
</header>
<main class="app">
  <aside class="lib" id="lib" aria-label="器具をえらぶ"></aside>
  <section class="stage-wrap" id="stageWrap" aria-label="実験台">
    <div id="stage"></div>
    <div class="labels" id="labels"></div>
    <div class="ov ov-tl"><button type="button" class="tgl" id="btnParts" aria-pressed="true">部分の名前</button></div>
    <div class="ov ov-tr">
      <button type="button" class="ibtn" id="btnReset" title="向きをもどす" aria-label="向きをもどす"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
      <button type="button" class="ibtn" id="btnFull" title="全画面" aria-label="全画面"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="toast" id="toast" hidden></div>
    <aside class="card" id="card" aria-live="polite"></aside>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ===== 小さな道具 =====
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const DONE_KEY = 'lab-3d:done';
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(DONE_KEY) || '[]')); } catch (e) { /* 保存できない環境でも動く */ }
function markDone(id) { done.add(id); try { localStorage.setItem(DONE_KEY, JSON.stringify([...done])); } catch (e) { /* 無視 */ } renderLib(); }

// ===== 3Dの部品づくり =====
let R = null;
const V2 = (x, y) => new THREE.Vector2(x, y);
// まわりの景色（実験室の明るい窓と天井）をガラスや金属に映りこませる
let ENV = null;
function envMap() {
  if (ENV) return ENV;
  const face = (top, bottom, win) => {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    const grd = g.createLinearGradient(0, 0, 0, 128); grd.addColorStop(0, top); grd.addColorStop(1, bottom);
    g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
    if (win) { g.fillStyle = 'rgba(255,255,255,0.95)'; g.fillRect(18, 20, 40, 56); g.fillRect(70, 20, 40, 56); }
    return c;
  };
  ENV = new THREE.CubeTexture([face('#f4f7fb', '#7d8794', true), face('#eef2f6', '#77808c', false), face('#ffffff', '#ffffff'), face('#2b3038', '#1b1f25'), face('#f2f5f9', '#808a96', true), face('#e9edf2', '#737c88', false)]);
  ENV.needsUpdate = true;
  return ENV;
}
function glassMat(extra) {
  return new THREE.MeshPhongMaterial(Object.assign({ color: 0xeaf4fb, transparent: true, opacity: 0.17, shininess: 220, specular: 0xffffff,
    envMap: envMap(), combine: THREE.MixOperation, reflectivity: 0.28, side: THREE.DoubleSide, depthWrite: false }, extra || {}));
}
function solid(color, extra) { return new THREE.MeshPhongMaterial(Object.assign({ color, shininess: 50, specular: 0x333333 }, extra || {})); }
function metal(color, refl) { return new THREE.MeshPhongMaterial({ color, shininess: 120, specular: 0xffffff, envMap: envMap(), combine: THREE.MixOperation, reflectivity: refl === undefined ? 0.45 : refl }); }
function liquidMat(color, op) { return new THREE.MeshPhongMaterial({ color, transparent: true, opacity: op || 0.55, side: THREE.DoubleSide, depthWrite: false, shininess: 90, envMap: envMap(), combine: THREE.MixOperation, reflectivity: 0.12 }); }
function lathe(pts, mat, seg) { return new THREE.Mesh(new THREE.LatheGeometry(pts.map(p => V2(Math.max(p[0], 0), p[1])), seg || 72), mat); }
function cyl(r1, r2, h, mat, seg) { return new THREE.Mesh(new THREE.CylinderGeometry(r1, r2, h, seg || 32), mat); }
// 厚みのあるガラス：内側の形（下から上）から、外側・丸めた口・内側をつなぐ
function shell(inner, t, mat, seg) {
  const out = inner.map(([r, y]) => (r < 1e-6 ? [0, y - t] : [r + t, y]));
  if (inner[0][0] < 1e-6 && inner.length > 1) out[1] = [out[1][0], out[1][1] - t * 0.7];
  const arc = (p, q, up) => {
    const cx = (p[0] + q[0]) / 2, cy = (p[1] + q[1]) / 2, rr = Math.hypot(p[0] - q[0], p[1] - q[1]) / 2;
    const a0 = Math.atan2(p[1] - cy, p[0] - cx), pts = [];
    for (let k = 1; k < 7; k++) { const a = a0 + (up ? 1 : -1) * Math.PI * k / 7; pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); }
    return pts;
  };
  const last = inner.length - 1;
  let pts = out.concat(arc(out[last], inner[last], true), inner.slice().reverse());
  if (inner[0][0] > 1e-6) pts = pts.concat(arc(inner[0], out[0], false));
  const m = lathe(pts, mat || glassMat(), seg);
  m.renderOrder = 2;
  return m;
}
// 内側の形（下から上へ）にそって、高さ h までの液体をつくる。液面は少しへこむ（メニスカス）
function liquid(inner, h, color, men) {
  const out = [[0, inner[0][1] + 0.01]];
  let rTop = inner[0][0];
  for (let i = 0; i < inner.length; i++) {
    const [r, y] = inner[i];
    if (y < h) { out.push([r * 0.985, Math.max(y, inner[0][1] + 0.01)]); rTop = r; continue; }
    const [r0, y0] = inner[i - 1] || inner[0];
    rTop = r0 + (r - r0) * (h - y0) / Math.max(y - y0, 1e-6);
    break;
  }
  const m = men === undefined ? 0.05 : men;
  out.push([rTop * 0.985, h], [rTop * 0.8, h - m * 0.45], [rTop * 0.5, h - m * 0.85], [0, h - m]);
  const mesh = lathe(out, liquidMat(color));
  mesh.renderOrder = 1;
  return mesh;
}
function textSprite(txt, h, color) {
  const c = document.createElement('canvas'); c.width = 128; c.height = 64;
  const g = c.getContext('2d');
  g.font = 'bold 44px Lexend, Arial, sans-serif'; g.fillStyle = color || '#24303f'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(txt, 64, 34);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  sp.scale.set(h * 2, h, 1);
  return sp;
}
// 円筒の表面に目盛りの線
function ticks(r, y0, y1, n, every, color, label) {
  const g = new THREE.Group();
  const pos = [];
  for (let i = 0; i <= n; i++) {
    const y = y0 + (y1 - y0) * i / n;
    const big = i % every === 0, mid = i % (every / 2) === 0;
    const w = big ? 0.55 : mid ? 0.38 : 0.22;
    const a0 = Math.PI / 2 - w / 2, steps = 6;
    for (let k = 0; k < steps; k++) {
      const a = a0 + w * k / steps, b = a0 + w * (k + 1) / steps;
      pos.push(Math.cos(a) * r, y, Math.sin(a) * r, Math.cos(b) * r, y, Math.sin(b) * r);
    }

function initThree() {
  if (!window.THREE || !THREE.OrbitControls) return false;
  try {
    const stage = $('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    stage.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(36, 1, 0.05, 200);
    scene.add(camera);
    const key = new THREE.DirectionalLight(0xffffff, 0.75); key.position.set(3, 5, 4); camera.add(key);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x8a96a8, 0.55));
    scene.add(new THREE.AmbientLight(0xffffff, 0.18));
    // 実験台
    // 実験台（黒い天板）
    const tc = document.createElement('canvas'); tc.width = tc.height = 256;
    const tg = tc.getContext('2d'); tg.fillStyle = '#323a42'; tg.fillRect(0, 0, 256, 256);
    for (let i = 0; i < 2200; i++) { tg.fillStyle = `rgba(255,255,255,${Math.random() * 0.05})`; tg.fillRect(Math.random() * 256, Math.random() * 256, 1.5, 1.5); }
    const tex = new THREE.CanvasTexture(tc); tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(4, 3);
    const bench = new THREE.Mesh(new THREE.BoxGeometry(18, 0.4, 11), new THREE.MeshPhongMaterial({ map: tex, shininess: 60, specular: 0x333333, envMap: envMap(), combine: THREE.MixOperation, reflectivity: 0.06 }));
    bench.position.y = -0.2; scene.add(bench);
    const edge = new THREE.Mesh(new THREE.BoxGeometry(18.1, 0.12, 11.1), new THREE.MeshPhongMaterial({ color: 0x1f252b })); edge.position.y = -0.05; scene.add(edge);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.09; controls.minDistance = 1.5; controls.maxDistance = 40;
    controls.maxPolarAngle = Math.PI * 0.55;
    const group = new THREE.Group(); scene.add(group);
    R = { renderer, scene, camera, controls, group, labels: [], tick: null };
    const resize = () => {
      const w = stage.clientWidth, h = stage.clientHeight;
      if (!w || !h) return;
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      const card = $('card'), narrow = window.matchMedia('(max-width: 900px)').matches;
      const ox = !narrow && !card.hidden ? Math.min(card.offsetWidth + 20, w * 0.5) / 2 : 0;
      const oy = narrow && !card.hidden ? Math.min(card.offsetHeight + 16, h * 0.55) / 2 : 0;
      if (ox || oy) camera.setViewOffset(w, h, ox, oy, w, h); else camera.clearViewOffset();
      camera.updateProjectionMatrix();

    R.resize = resize;
    new ResizeObserver(resize).observe(stage);
    resize();
    requestAnimationFrame(loop);
    return true;
  } catch (e) { return false; }
}
function clearScene() {
  const g = R.group;
  while (g.children.length) {
    const o = g.children.pop();
    o.traverse(x => { if (x.geometry) x.geometry.dispose(); if (x.material) { if (x.material.map && !x.userData.keepMap) x.material.map.dispose(); x.material.dispose(); } });
  }
  $('labels').innerHTML = '';
  R.labels = []; R.tick = null;
}
function addLabel(text, getPos, cls) {
  const el = document.createElement('div');
  el.className = 'lbl' + (cls ? ' ' + cls : '');
  el.textContent = text;
  $('labels').appendChild(el);
  const L = { el, get: getPos };
  R.labels.push(L);
  return L;
}
function frame(focusY, radius, dir) {
  R.resize();
  const cam = R.camera, stage = $('stage');
  const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
  const narrow = window.matchMedia('(max-width: 900px)').matches, card = $('card');
  const wEff = narrow ? w : w - Math.min(card.offsetWidth + 20, w * 0.5);
  const hEff = narrow ? h - Math.min(card.offsetHeight + 16, h * 0.55) : h;
  const tanV = Math.tan(cam.fov * Math.PI / 360);
  const half = Math.min(Math.atan(tanV * hEff / h), Math.atan(tanV * wEff / h));
  const dist = radius / Math.sin(half) * 1.05;
  const d = (dir || new THREE.Vector3(0.35, 0.3, 1)).clone().normalize();
  R.controls.target.set(0, focusY, 0);
  cam.position.copy(d.multiplyScalar(dist)).add(R.controls.target);
  R.controls.update();
}
function loop(now) {
  requestAnimationFrame(loop);
  if (!R) return;
  const t = now / 1000;
  if (R.tick) R.tick(t);
  R.controls.update();
  R.renderer.render(R.scene, R.camera);
  const stage = $('stage'), w = stage.clientWidth, h = stage.clientHeight;
  const v = new THREE.Vector3();
  R.labels.forEach(L => {
    if (L.el.hidden) return;
    v.copy(L.get()).project(R.camera);
    if (v.z > 1) { L.el.style.visibility = 'hidden'; return; }
    L.el.style.visibility = '';
    L.el.style.transform = `translate(${((v.x + 1) / 2 * w).toFixed(1)}px, ${((1 - v.y) / 2 * h - 14).toFixed(1)}px) translate(-50%, -100%)`;
  });
  if (state.quiz && state.quiz.timer) state.quiz.timer();
}
let toastTimer = 0;
function toast(msg, kind) {
  const el = $('toast');
  el.textContent = msg; el.className = 'toast ' + (kind || 'info'); el.hidden = false; el.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = 0; setTimeout(() => { el.hidden = true; }, 300); }, kind === 'ng' ? 3200 : 2400);
}

      <p class="note">液の量</p><div class="row">${opt('amount', 'full', '球の8分目')}${opt('amount', 'half', '半分以下')}</div>
      <p class="note">受け器の口</p><div class="row">${opt('seal', true, 'ゴム栓でふさぐ')}${opt('seal', false, 'ふさがない（アルミはくでかるくおおう）')}</div>
      <button type="button" class="btn main" data-a="dheat" ${s.running ? 'disabled' : ''}>加熱する</button>`;
    if (s.result && (s.result.done || !s.result.ok)) h += `<div class="verdict ${s.result.ok ? 'ok' : 'ng'}">${s.result.msg}</div>`;
    return h + '</div>';
  },
  act(a, v) {
    const s = state.pr;
    if (a === 'set') { const [k, val] = v.split(':'); s[k] = val === 'true' ? true : val === 'false' ? false : val; s.result = null; s.running = false; }
    if (a === 'dheat') {
      const bad = [];
      if (s.therm !== 'branch') bad.push('温度計の球部は、枝の付け根の高さにする（出ていく蒸気の温度をはかるため。液の中では液の温度になってしまう）');
      if (!s.stone) bad.push('沸騰石を入れないと、突沸（急に激しく沸騰する）して危険');
      if (s.water !== 'bottom') bad.push('冷却水は下から入れて上から出す（上から入れると冷却器の中に水が満たされず、よく冷えない）');
      if (s.amount !== 'half') bad.push('液はフラスコの半分以下にする（多いと、沸騰した液が枝に入ってしまう）');
      if (s.seal) bad.push('受け器をゴム栓で密閉すると、中の圧力が上がって装置が破裂する危険がある');
      s.result = bad.length ? { ok: false, msg: 'このままでは危ない・うまくいかない：' + bad.join('。') + '。' } : { ok: true, msg: 'うまく蒸留できた！ 沸点の低いエタノール（78 ℃）が先に気体になり、冷却器で冷やされて液体にもどり、受け器にたまる。' };
      if (!bad.length) { s.running = true; s.t0 = performance.now(); markDone('p-distill'); }
    }
    renderCard();
  },
};

function quizStart(kind) {
  const qs = [];
  for (let i = 0; i < 10; i++) {
    if (kind === 'name' || (kind === 'mix' && i % 2 === 0)) {
      const it = pick(ITEMS);
      qs.push({ type: 'name', item: it, q: 'この器具の名前は？', choices: shuffle([it.name, ...shuffle(ITEMS.filter(x => x.id !== it.id)).slice(0, 3).map(x => x.name)]), answer: it.name, explain: it.use });
    } else {
      const [q, ans, ex] = pick(SAFETY_Q);
      const it = ITEMS.find(x => q.includes(x.name.replace('（ろ過）', ''))) || ITEMS.find(x => q.includes(x.name.slice(0, 3))) || ITEMS[0];
      qs.push({ type: 'safety', item: it, q: '正しい？ まちがい？<br>' + esc(q), choices: ['正しい ○', 'まちがい ×'], answer: ans ? '正しい ○' : 'まちがい ×', explain: ex });
    }
  }
  state.quiz = { kind, qs, i: 0, score: 0, picked: null };
  quizShow();
}
function quizShow() {
  const qz = state.quiz, q = qz.qs[qz.i];
  clearScene();
  const m = MODELS[q.item.model]();
  R.group.add(m.g);
  if (m.flame) { m.flame.lit = false; R.tick = t => m.flame.update(t); }
  renderCard();
  frame(m.focus[0], m.focus[1]);
}
function quizCardHTML() {
  const qz = state.quiz;

    return `<div class="card-head"><div class="eyebrow">クイズ</div><h2 class="name">結果 ${qz.score} / 10</h2></div><div class="body">
      <div class="verdict ${qz.score >= 7 ? 'ok' : ''}">${qz.score === 10 ? '全問正解！ 実験の準備はばっちり。' : qz.score >= 7 ? 'よくできました！' : '「器具を見る」の注意を読んでから、もう一度。'}</div>
      <p style="margin-top:10px" class="row"><button type="button" class="btn main" data-quiz="${qz.kind}">もう一度</button></p></div>`;
  }
  const q = qz.qs[qz.i];
  let h = `<div class="card-head"><div class="eyebrow">クイズ ${qz.i + 1} / 10 ・ 正解 ${qz.score}</div><div class="qprog"><i style="width:${qz.i * 10}%"></i></div></div><div class="body">
    <p class="qtext">${q.q}</p><div class="qchoices">${q.choices.map((c, k) => {
    let cls = '';

    h += `<div class="verdict ${qz.picked === q.answer ? 'ok' : 'ng'}" style="margin-top:8px">${qz.picked === q.answer ? '正解！' : `正解は「${esc(q.answer)}」`}</div><p class="use" style="margin-top:6px">${esc(q.explain)}</p>
      <button type="button" class="btn main" data-a="qnext">${qz.i === 9 ? '結果を見る' : '次の問題'}</button>`;

}

function renderLib() {
  const lib = $('lib');
  if (state.mode === 'see') {
    let h = '', last = '';
    ITEMS.forEach(it => {
      if (it.grp !== last) { h += `<div class="grp">${esc(it.grp)}</div>`; last = it.grp; }
      h += `<button type="button" class="item" data-see="${it.id}" aria-current="${state.id === it.id}"><span class="ic">${ICON[it.id]}</span>${esc(it.name)}</button>`;
    });
    lib.innerHTML = h;
  } else if (state.mode === 'practice') {
    let last = '';
    lib.innerHTML = PRACTICES.map(p => (p.grp !== last ? `<div class="grp">${(last = p.grp) === '実験' ? '実験' : '基本操作の練習'}</div>` : '') + `<button type="button" class="item" data-goto="${p.id}" aria-current="${state.id === p.id}"><span class="ic">${p.icon}</span>${esc(p.name)}${done.has(p.id) ? '<span class="done">✓</span>' : ''}</button>`).join('')
      + `<p class="note" style="margin:10px 4px">クリア ${PRACTICES.filter(p => done.has(p.id)).length} / ${PRACTICES.length}</p>`;
  } else {
    lib.innerHTML = '<div class="grp">クイズ</div>' + [['name', '器具の名前あて'], ['safety', '安全な使い方 ○×'], ['mix', 'ミックス']].map(([k, n]) => `<button type="button" class="item" data-quiz="${k}" aria-current="${state.quiz && state.quiz.kind === k}"><span class="ic">Q</span>${n}</button>`).join('');
  }
}
function renderCard() {
  const card = $('card');

  if (state.mode === 'see') h = seeCardHTML(ITEMS.find(x => x.id === state.id));
  else if (state.mode === 'practice') h = practiceCardHTML(PRACTICES.find(x => x.id === state.id));
  else h = state.quiz ? quizCardHTML() : quizMenuHTML();

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll('#modes [data-mode]').forEach(b => b.setAttribute('aria-current', String(b.dataset.mode === mode)));
  if (mode === 'see') go('see', ITEMS.some(x => x.id === state.id) ? state.id : 'beaker');
  else if (mode === 'practice') go('practice', PRACTICES.some(x => x.id === state.id) ? state.id : 'p-burner');
  else { state.quiz = null; state.id = null; renderLib(); if (R) { clearScene(); const m = MODELS.burner(); R.group.add(m.g); frame(m.focus[0], m.focus[1]); } renderCard(); }
}
function go(mode, id) {
  state.mode = mode; state.id = id; state.tab = 'use'; state.ptab = 'op'; state.quiz = null;
  document.querySelectorAll('#modes [data-mode]').forEach(b => b.setAttribute('aria-current', String(b.dataset.mode === mode)));
  renderLib();
  if (!R) { renderCard(); return; }
  if (mode === 'see') showItem(id); else showPractice(id);
  try { history.replaceState(null, '', '#' + id); } catch (e) { /* 無視 */ }
}

  const ptab = t.closest('[data-ptab]');
  if (ptab) { state.ptab = ptab.dataset.ptab; renderCard(); const b = $('card').querySelector('.body'); if (b) b.scrollTop = 0; return; }
  const tab = t.closest('[data-tab]');
  if (tab) { state.tab = tab.dataset.tab; renderCard(); return; }
  const pk = t.closest('[data-pick]');
  if (pk && state.quiz) { const q = state.quiz.qs[state.quiz.i]; state.quiz.picked = q.choices[+pk.dataset.pick]; if (state.quiz.picked === q.answer) state.quiz.score++; renderCard(); return; }
  const a = t.closest('[data-a]');
  if (a) {
    if (a.dataset.a === 'qnext') { state.quiz.i++; state.quiz.picked = null; if (state.quiz.i >= 10) renderCard(); else quizShow(); return; }
    PR[state.id].act(a.dataset.a); return;
  }
  for (const [attr, act] of [['data-gas', 'gas'], ['data-method', 'method'], ['data-elyte', 'elyte'], ['data-sample', 'sample'], ['data-fq', 'fq']]) {
    const b = t.closest('[' + attr + ']');
    if (b && state.pr) { PR[state.id].act(act, b.getAttribute(attr)); return; }
  }
  const eye = t.closest('[data-eye]');
  if (eye) { PR[state.id].act('eye', eye.dataset.eye); return; }
  const opt = t.closest('[data-opt]');
  if (opt) { PR[state.id].act('opt', opt.dataset.opt); return; }
  const set = t.closest('[data-set]');
  if (set) { PR[state.id].act('set', set.dataset.set); return; }
});
document.addEventListener('input', ev => {
  const id = ev.target.id, v = +ev.target.value;
  const map = { gasS: 'gas', airS: 'air', amtS: 'amt', wickS: 'wick', fillS: 'fill', tubeS: 'amt', voltS: 'volt' };
  if (map[id] && state.pr) {
    PR[state.id].act(map[id], v);
    const el = $(id); if (el) el.focus();
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.id === 'readV') PR['p-cylinder'].act('judge'); if (ev.key === 'Enter' && ev.target.id === 'tAns') PR['p-titr'].act('tjudge'); });
$('btnParts').addEventListener('click', () => {
  state.parts = !state.parts;
  $('btnParts').setAttribute('aria-pressed', String(state.parts));
  if (R) R.labels.forEach(L => { if (L.part) L.el.hidden = !state.parts; });
});
$('btnReset').addEventListener('click', () => { if (state.mode === 'practice' && state.id === 'p-cylinder') PR['p-cylinder'].view(); else if (state.mode === 'practice') go('practice', state.id); else if (state.mode === 'see') showItem(state.id); });
$('btnFull').addEventListener('click', () => {
  const w = $('stageWrap');
  if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
  if (w.requestFullscreen) w.requestFullscreen().catch(() => w.classList.toggle('is-max')); else w.classList.toggle('is-max');
});

// ===== はじめる =====
(function start() {
  const ok = initThree();
  if (!ok) $('stage').innerHTML = '<div class="fallback">3D表示の部品（three.js）を読み込めませんでした。<br>インターネットにつながっているか確認して、開き直してください。</div>';
  let h = '';
  try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) { /* 無視 */ }
  if (PRACTICES.some(p => p.id === h)) go('practice', h);
  else if (ITEMS.some(x => x.id === h)) go('see', h);
  else go('see', 'beaker');
})();
</script>
</body>
