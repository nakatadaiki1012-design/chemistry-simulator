<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>実験ラボ3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="化学の実験器具を3Dで見て、使い方を練習できるアプリ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Lexend:wght@400;500;600&display=swap">
<style>
/* レイアウト：左に器具の棚、右に3Dの実験台。説明と操作パネルは実験台の中 */
:root {
  --bg: #eef1f4; --panel: #ffffff; --glass: rgba(255, 255, 255, 0.94); --ink: #172231; --muted: #5b6676; --line: #d6dce4; --chip: #e8edf2;
  --accent: #0f7a6e; --accent-ink: #ffffff; --warm: #d9661f; --ok: #1f8a5b; --ng: #d33a2c;
  --bench-1: #f7f8fa; --bench-2: #d7dde4;
  --font-display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-data: "Lexend", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --r: 12px; --card-w: 370px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1218; --panel: #131c25; --glass: rgba(19, 28, 37, 0.93); --ink: #e6edf3; --muted: #97a3b2; --line: #263240; --chip: #1c2833;
    --accent: #3cc4b2; --accent-ink: #0c1218; --warm: #ffa04d; --ok: #4fd19a; --ng: #ff6b5e; --bench-1: #1b2631; --bench-2: #070b10; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1218; --panel: #131c25; --glass: rgba(19, 28, 37, 0.93); --ink: #e6edf3; --muted: #97a3b2; --line: #263240; --chip: #1c2833;
  --accent: #3cc4b2; --accent-ink: #0c1218; --warm: #ffa04d; --ok: #4fd19a; --ng: #ff6b5e; --bench-1: #1b2631; --bench-2: #070b10; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; display: flex; flex-direction: column; overflow: hidden; margin: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .5; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
sub, sup { font-size: .68em; line-height: 0; }
.top { display: flex; align-items: center; gap: 12px; padding-block: 6px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 18px; margin: 0; white-space: nowrap; }
.brand b { color: var(--accent); }
.modes { display: flex; gap: 2px; background: var(--chip); border-radius: 10px; padding: 3px; }
.modes button { border: 0; background: transparent; padding: 3px 14px; border-radius: 8px; font-size: 14px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.modes button[aria-current="true"] { background: var(--panel); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.back { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; font-weight: 700; color: var(--accent); text-decoration: none; white-space: nowrap; }
.back svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.back:hover { border-color: var(--accent); }
.app { flex: 1; min-height: 0; display: grid; gap: 12px; grid-template-columns: 236px minmax(0, 1fr) 350px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.lib { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); overflow-y: auto; padding: 10px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.cats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.cat { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 4px; font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.cat small { display: none; margin-left: 5px; font-family: var(--font-data); font-weight: 500; font-size: 10.5px; opacity: .8; }
.cat[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.items { display: flex; flex-direction: column; gap: 2px; }
.libfoot { font-size: 12px; color: var(--muted); margin: auto 4px 0; }
.grp { font-size: 11px; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin: 10px 4px 4px; }
.grp:first-child { margin-top: 2px; }
.item { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; border: 1px solid transparent; background: transparent; border-radius: 9px; padding: 6px 8px; font-size: 14px; }
.item:hover { background: var(--chip); }
.item[aria-current="true"] { background: var(--chip); border-color: var(--accent); font-weight: 700; }
.item .ic { width: 22px; height: 22px; border-radius: 6px; background: var(--chip); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--accent); flex: none; font-family: var(--font-data); }
.item[aria-current="true"] .ic { background: var(--accent); color: var(--accent-ink); }
.item .done { margin-left: auto; color: var(--ok); font-weight: 700; }
.stage-wrap { position: relative; border-radius: var(--r); overflow: hidden; min-height: 0; border: 1px solid var(--line); background: radial-gradient(120% 90% at 40% 30%, var(--bench-1), var(--bench-2)); }
.stage-wrap.is-max { position: fixed; inset: 0; z-index: 50; border-radius: 0; }
#stage { position: absolute; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.lbl { position: absolute; left: 0; top: 0; white-space: nowrap; will-change: transform; font-size: 12.5px; font-weight: 700; color: var(--ink); background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; }
.lbl::before { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 10px; background: var(--muted); }
.lbl.warn { background: var(--ng); color: #fff; border-color: var(--ng); }
.lbl.co { line-height: 22px; }
.lbl.co::before { display: none; }
.leaders { position: absolute; inset: 0; width: 100%; height: 100%; color: var(--muted); overflow: visible; }
.ov { position: absolute; z-index: 2; display: flex; gap: 6px; }
.ov-tl { top: 10px; left: 10px; }
.ov-tr { top: 10px; right: 10px; }
.ibtn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
.ibtn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tgl { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 0 12px; height: 36px; font-size: 13px; }
.tgl[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; }
.toast { position: absolute; z-index: 4; left: 50%; top: 56px; transform: translateX(-50%); max-width: min(560px, calc(100% - 40px)); padding: 8px 14px; border-radius: 12px; font-weight: 700; font-size: 15px; box-shadow: 0 8px 24px rgba(0,0,0,.18); text-align: center; text-wrap: balance; transition: opacity .3s; }
.toast.ok { background: var(--ok); color: #fff; } .toast.ng { background: var(--ng); color: #fff; } .toast.info { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; overflow: hidden; min-width: 0; min-height: 0; }
.card-head { padding: 10px 14px 2px; display: flex; align-items: flex-start; gap: 8px; }
.card-head > div:first-child { flex: 1; min-width: 0; }
.headbtn { flex: none; margin-top: 14px; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 4px 10px; font-size: 13px; font-weight: 700; }
.eyebrow { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.name { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.25; margin: 2px 0 0; }
.yomi { font-size: 12px; color: var(--muted); font-family: var(--font-data); }
.tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 2px; margin: 8px 14px 0; background: var(--chip); border-radius: 10px; padding: 3px; }
.tabs button { white-space: nowrap; border: 0; background: transparent; padding: 5px 4px; font-size: 13.5px; font-weight: 700; color: var(--muted); border-radius: 8px; }
.tabs button[aria-selected="true"] { background: var(--panel); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seqhead { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--muted); }
.seqhead b { font-family: var(--font-data); font-size: 17px; color: var(--ink); }
.qlead { margin: 4px 0 0; font-weight: 700; font-size: 14.5px; }
.seqopts { display: flex; flex-direction: column; gap: 6px; }
.seqo { text-align: left; border: 1.5px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 12px; font-size: 14px; font-weight: 700; line-height: 1.5; }
.seqo:hover { border-color: var(--accent); }
details.donelist { font-size: 13px; color: var(--muted); }
details.donelist summary { cursor: pointer; font-weight: 700; }
details.donelist ol, ol.placed { margin: 4px 0 0; padding-left: 22px; font-size: 13px; }
ol.placed { color: var(--ok); font-weight: 700; margin-bottom: 6px; }
ol.stepper { list-style: none; margin: 8px 0 0; padding: 0; }
ol.stepper li { border-bottom: 1px solid var(--line); }
ol.stepper button { width: 100%; display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 0; background: transparent; padding: 7px 2px; font-size: 14px; line-height: 1.5; }
ol.stepper .n { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--chip); color: var(--accent); display: grid; place-items: center; font: 600 12px var(--font-data); margin-top: 1px; }
ol.stepper li.open .n { background: var(--accent); color: var(--accent-ink); }
ol.stepper li.open .t { font-weight: 700; }
ol.stepper .why { margin: 0 0 8px 32px; font-size: 13px; color: var(--muted); line-height: 1.6; }
h3.sub { font-size: 13px; color: var(--muted); margin: 4px 0 2px; letter-spacing: .04em; }
h3.sub + ul { margin-bottom: 10px; }
.body { overflow-y: auto; padding: 10px 14px 0; flex: 1; min-height: 0; }
.body::after { content: ""; display: block; height: 14px; }
.use { margin: 0 0 8px; font-size: 14.5px; }
ol.how { margin: 0; padding-left: 22px; font-size: 14px; }
ol.how li { margin-bottom: 4px; }
ul.caution { list-style: none; margin: 0; padding: 0; font-size: 14px; }
ul.caution li { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line); }
ul.caution li b { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; color: #fff; margin-top: 2px; }
ul.caution li b.o { background: var(--ok); } ul.caution li b.x { background: var(--ng); }
.parts { display: flex; flex-wrap: wrap; gap: 4px; }
.parts span { font-size: 12.5px; background: var(--chip); border-radius: 6px; padding: 1px 8px; }
.ctl { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; flex-wrap: wrap; gap: 6px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 12px; font-size: 14px; font-weight: 700; }
.btn:not(:disabled):hover { border-color: var(--accent); }
.btn.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
/* 実験のメインの操作ボタンは、説明が長くてもパネルの下に見えたままにする */
.body .ctl > .btn.main[data-a], .body .ctl > .row:has(> .btn.main[data-a]) { position: sticky; bottom: 0; z-index: 2; }
.body .ctl > .btn.main[data-a] { box-shadow: 0 0 0 6px var(--panel); }
.body .ctl > .row:has(> .btn.main[data-a]) { background: var(--panel); padding: 6px 0; }
.btn.bad { color: var(--ng); }
.btn[aria-pressed="true"] { border-color: var(--accent); background: var(--chip); color: var(--accent); }
.sl { display: grid; grid-template-columns: 7.5em minmax(0, 1fr) 3.4em; gap: 8px; align-items: center; font-size: 13.5px; }
.sl input { accent-color: var(--accent); width: 100%; }
.sl output { font-family: var(--font-data); font-size: 13px; text-align: right; }
.checklist { list-style: none; margin: 0; padding: 0; font-size: 13.5px; }
.checklist li { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; color: var(--muted); }
.checklist li::before { content: ""; flex: none; width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--line); margin-top: 3px; }
.checklist li.done { color: var(--ink); }
.checklist li.done::before { background: var(--ok); border-color: var(--ok); }
.checklist li.now { color: var(--ink); font-weight: 700; }
.checklist li.now::before { border-color: var(--accent); }
.verdict { border-radius: 10px; padding: 8px 10px; font-weight: 700; font-size: 14px; background: var(--chip); border-left: 4px solid var(--warm); }
.verdict.ok { border-left-color: var(--ok); color: var(--ok); }
.verdict.ng { border-left-color: var(--ng); color: var(--ng); }
.note { font-size: 12.5px; color: var(--muted); margin: 0; }
.readin { display: flex; gap: 8px; align-items: center; }
.readin input { width: 7em; font-family: var(--font-data); font-size: 18px; font-weight: 600; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
.qtext { font-size: 17px; font-weight: 700; line-height: 1.55; margin: 2px 0 8px; }
.qchoices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.qc { border: 1.5px solid var(--line); background: var(--panel); border-radius: 10px; padding: 9px 8px; font-size: 15px; font-weight: 700; min-height: 46px; }
.qc.right { background: var(--ok); color: #fff; border-color: var(--ok); } .qc.wrong { color: var(--ng); border-color: var(--ng); } .qc.dim { opacity: .5; }
.qprog { height: 5px; border-radius: 999px; background: var(--chip); overflow: hidden; margin: 6px 0; }
.qprog i { display: block; height: 100%; background: var(--accent); }
.purpose { background: var(--chip); border-left: 3px solid var(--accent); border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: 14px; line-height: 1.65; }
.series { display: flex; flex-wrap: wrap; gap: 3px; font-size: 12px; margin: 6px 0; }
.series span { padding: 2px 5px; border-radius: 6px; background: var(--chip, rgba(127,127,127,.12)); }
.series .me { background: #f59e0b; color: #fff; font-weight: 700; }
.series .ion { background: #3b82f6; color: #fff; font-weight: 700; }
.purpose > b:first-child { display: block; font-size: 12px; color: var(--accent); }
.purpose b { color: var(--accent); }
ol.whysteps { margin: 6px 0 0; padding-left: 22px; font-size: 14px; }
ol.whysteps li { margin-bottom: 8px; }
ol.whysteps li b { display: block; }
ol.whysteps li span { display: block; color: var(--muted); font-size: 13px; line-height: 1.6; }
ul.caution.danger li b.x { background: #b7791f; }
.gtab { width: 100%; border-collapse: collapse; font-size: 13px; margin: 2px 0; }
.gtab th { text-align: left; font-weight: 500; color: var(--muted); padding: 3px 8px 3px 0; white-space: nowrap; vertical-align: top; }
.gtab td { padding: 3px 0; }
.gtab tr + tr > * { border-top: 1px solid var(--line); }
.gtab .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.elecv { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; background: var(--chip); border-radius: 10px; padding: 6px 10px; }
.elecv b { font-family: var(--font-data); font-size: 17px; }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }
@media (max-width: 1200px) { .app { grid-template-columns: 196px minmax(0, 1fr) 330px; } }
@media (max-width: 900px) {
  .app { display: flex; flex-direction: column; }
  .lib { padding: 8px; gap: 6px; overflow: visible; }
  .cats { display: flex; overflow-x: auto; padding-bottom: 6px; }
  .cat { padding: 3px 10px; border-radius: 999px; }
  .cat small { display: inline; }
  .items { flex-direction: row; overflow-x: auto; gap: 6px; }
  .libfoot, .grp { display: none; }
  .item { flex: 0 0 auto; width: auto; white-space: nowrap; border-color: var(--line); }
  .app { gap: 6px; padding-block: 6px; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
  .lib { flex: none; padding: 6px; }
  .stage-wrap { flex: 1 1 0; min-height: 180px; }
  .card { flex: 0 1 auto; max-height: 50%; min-height: 0; }
  .card-head { padding: 6px 12px 0; }
  .name { font-size: 18px; }
  .yomi { display: none; }
  .tabs { margin: 6px 12px 0; }
  .body { padding: 8px 12px 10px; }
  .modes button { padding: 3px 10px; }
  .top { gap: 8px; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); }
  .brand { font-size: 16px; }
  .back { padding: 0 8px; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<header class="top">
  <h1 class="brand">実験ラボ<b>3D</b></h1>
  <nav class="modes" id="modes" aria-label="モード">
    <button type="button" data-mode="see" aria-current="true" title="器具を見る">器具</button>
    <button type="button" data-mode="practice" aria-current="false" title="操作の練習・実験">操作</button>
    <button type="button" data-mode="quiz" aria-current="false" title="クイズ">クイズ</button>
  </nav>
  <a class="back" id="backLink" href="index.html" target="_blank" rel="noopener" title="分子ラボ3D を開く（新しいタブ）">分子3D<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"/></svg></a>
</header>
<main class="app">
  <aside class="lib" id="lib" aria-label="器具をえらぶ"></aside>
  <section class="stage-wrap" id="stageWrap" aria-label="実験台">
    <div id="stage"></div>
    <div class="labels" id="labels"></div>
    <div class="ov ov-tl"><button type="button" class="tgl" id="btnParts" aria-pressed="true">部分の名前</button></div>
    <div class="ov ov-tr">
      <button type="button" class="ibtn" id="btnReset" title="向きをもどす" aria-label="向きをもどす"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
      <button type="button" class="ibtn" id="btnFull" title="全画面" aria-label="全画面"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    </div>
    <div class="toast" id="toast" hidden></div>
  </section>
  <aside class="card" id="card" aria-live="polite"></aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ===== 小さな道具 =====
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const DONE_KEY = 'lab-3d:done';
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(DONE_KEY) || '[]')); } catch (e) { /* 保存できない環境でも動く */ }
function markDone(id) { done.add(id); try { localStorage.setItem(DONE_KEY, JSON.stringify([...done])); } catch (e) { /* 無視 */ } renderLib(); }

// ===== 3Dの部品づくり =====
let R = null;
const V2 = (x, y) => new THREE.Vector2(x, y);
// まわりの景色（実験室の明るい窓と天井）をガラスや金属に映りこませる
let ENV = null;
function envMap() {
  if (ENV) return ENV;
  const face = (top, bottom, win) => {

PR['p-cylinder'] = {
  init() {

    this.view();

      <div class="readin"><input id="readV" type="number" step="0.1" inputmode="decimal" placeholder="例 45.6" aria-label="読んだ値"><span>mL</span><button type="button" class="btn main" data-a="judge">答え合わせ</button></div>
      ${ans ? `<div class="verdict ${ans.ok ? 'ok' : 'ng'}">${ans.ok ? '正解！' : 'おしい'} 正しい読みは <b>${s.v.toFixed(1)} mL</b>（あなた：${ans.val.toFixed(1)} mL）。${ans.ok ? '' : Math.abs(ans.val - s.v) >= 0.95 ? '目盛りの数え方を見直そう。' : '最後のけた（0.1 mL）は目分量で、だいたい合っていれば OK。'}</div>` : ''}

      } else if (m === 'down' && !heavy) {
        r = { level: 'ng', leak: 1, msg: `${gas.name}は空気より軽い（分子量${gas.M} < 29）ので、口が上を向いたびんから上へにげてしまう。` };
      } else {
        r = { level: 'mid', msg: `一応集まるが、${gas.name}は水に溶けにくいので、<b>水上置換</b>がいちばんよい。上方・下方置換では空気がまざりやすく、どれだけたまったかも見えない。` };
      }
      s.result = r; s.running = true; s.t0 = performance.now();
    }
    if (a === 'gtest') toast(GASES.find(x => x.id === s.gas).test, 'ok');
    renderCard();
  },
};

    const jacket = cyl(0.22, 0.22, jA.distanceTo(jB), glassMat({ opacity: 0.3 }), 24); placeBetween(jacket, jA, jB); g.add(jacket);
    const jw = cyl(0.2, 0.2, jA.distanceTo(jB), liquidMat(0x8fc9ef, 0.28), 24); placeBetween(jw, jA, jB); g.add(jw);
    const portLow = cA.clone().lerp(cB, 0.84), portHigh = cA.clone().lerp(cB, 0.16);
    g.add(tubePath([[portLow.x, portLow.y - 0.15], [portLow.x, portLow.y - 0.6], [portLow.x + 0.4, portLow.y - 1.1]], 0.05, solid(0xd25b2a)));
    g.add(tubePath([[portHigh.x, portHigh.y + 0.15], [portHigh.x, portHigh.y + 0.6], [portHigh.x - 0.3, portHigh.y + 1.0]], 0.05, solid(0xd25b2a)));
    const stand2 = makeStand(3.4, 2.8, 1.1); stand2.position.set(0.9, 0, -0.5); g.add(stand2);
    // アダプターと受け器

    const rc = MODELS.erlen(); rc.g.scale.setScalar(0.42); rc.g.position.set(2.75, 0, 0); g.add(rc.g);

function tripod(h, r) {
  const g = new THREE.Group(), m = solid(0x2f343b, { shininess: 40 });
  const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.04, 8, 40), m); ring.rotation.x = Math.PI / 2; ring.position.y = h; g.add(ring);
  for (let i = 0; i < 3; i++) {
    const a = i * Math.PI * 2 / 3;
    const leg = cyl(0.035, 0.035, 1, m, 8);
    placeBetween(leg, new THREE.Vector3(Math.cos(a) * r, h, Math.sin(a) * r), new THREE.Vector3(Math.cos(a) * (r + 0.35), 0, Math.sin(a) * (r + 0.35)));
    g.add(leg);
  }
  return g;
}

function svgGraph(w, h, pts, line, xLab, yLab, xMax, yMax, extra) {
  const X = v => 34 + v / xMax * (w - 44), Y = v => h - 22 - v / yMax * (h - 40);
  let s = `<svg class="tcurve" viewBox="0 0 ${w} ${h}" role="img"><line x1="34" y1="${Y(0)}" x2="${w - 8}" y2="${Y(0)}" stroke="currentColor" stroke-opacity=".5"/><line x1="34" y1="8" x2="34" y2="${Y(0)}" stroke="currentColor" stroke-opacity=".5"/>`;
  s += `<text x="${w - 8}" y="${Y(0) - 5}" font-size="9" text-anchor="end" fill="currentColor" fill-opacity=".75">${xLab}</text><text x="38" y="11" font-size="9" fill="currentColor" fill-opacity=".75">${yLab}</text>`;
  [0.5, 1].forEach(f => { s += `<text x="30" y="${Y(yMax * f) + 3}" font-size="8" text-anchor="end" fill="currentColor">${+(yMax * f).toFixed(1)}</text><text x="${X(xMax * f)}" y="${Y(0) + 11}" font-size="8" text-anchor="middle" fill="currentColor">${+(xMax * f).toFixed(1)}</text>`; });
  if (line) s += `<polyline points="${line.map(([a, b]) => `${X(a).toFixed(1)},${Y(b).toFixed(1)}`).join(' ')}" fill="none" stroke="#d9661f" stroke-width="2"${line.dashed ? ' stroke-dasharray="4 3"' : ''}/>`;
  (extra || []).forEach(e => { s += e(X, Y); });
  pts.forEach(([a, b]) => { s += `<circle cx="${X(a)}" cy="${Y(b)}" r="4" fill="#2753d6"/>`; });
  return s + '</svg>';
}

PR['p-ionize'] = {
  init() {

    R.tick = t => {
      const m = METALS_X.find(x => x.id === s.metal), so = SOLS.find(x => x.id === s.sol);

      const y = s.dipped ? 1.6 : 3.6;
      plate.position.set(0, s.plate.position.y + (y - s.plate.position.y) * 0.1, 0);
      coat.position.set(0, plate.position.y - 1.7 + 0.05, 0);
      const showCoat = s.dipped && reacts && so.dep;
      coat.children.forEach(c => { c.visible = showCoat && c.userData.k < s.k; c.material.color.set(so.dep || 0); if (so.id === 'ag') c.scale.set(1, 2.5, 1); else c.scale.set(1, 1, 1); });
      let col = new THREE.Color(so.c), op = so.op;
      if (s.dipped && reacts && so.id === 'cu') { col.lerp(new THREE.Color(m.id === 'Fe' ? 0xb8d4b0 : 0xeef3f6), s.k * 0.85); op = so.op - 0.2 * s.k; }
      if (s.dipped && reacts && so.id === 'ag' && m.id === 'Cu') { col.lerp(new THREE.Color(0x4a9be8), s.k * 0.7); op = 0.3 + 0.2 * s.k; }

  },
  html() {
    const s = state.pr, m = METALS_X.find(x => x.id === s.metal), so = SOLS.find(x => x.id === s.sol);
    const reacts = SERIES.indexOf(m.id) < SERIES.indexOf(so.ion);
    let res = '';

      if (m.id === so.ion) res = `<div class="verdict">同じ金属のイオンなので、変化しない。</div>`;
      else if (!reacts) res = `<div class="verdict">変化なし。${m.name}（${m.id}）は ${so.ion} よりイオン化傾向が小さいので、反応しない。</div>`;
      else if (so.id === 'hcl') res = `<div class="verdict ok">あわ（水素）が出て、${m.name}が溶ける。${m.id} は H₂ よりイオン化傾向が大きい。<br>${m.id} + 2H⁺ → ${m.id}²⁺ + H₂</div>`;
      else res = `<div class="verdict ok">${m.name}の表面に${so.depName}が出てきた！ ${m.id} が電子を出してイオンになり、${so.ion} のイオンが電子を受け取って金属になる。<br>${so.ion === 'Ag' ? `${m.id} + 2Ag⁺ → ${m.id}²⁺ + 2Ag` : `${m.id} + ${so.ion}²⁺ → ${m.id}²⁺ + ${so.ion}`}${so.id === 'cu' ? '（青色がうすくなる）' : ''}${m.id === 'Cu' && so.id === 'ag' ? '（水溶液が青くなる）' : ''}</div>`;

      <p class="note">金属板</p><div class="row">${METALS_X.map(x => `<button type="button" class="btn" data-metal="${x.id}" aria-pressed="${s.metal === x.id}">${x.id} ${x.name}</button>`).join('')}</div>

  },
  act(a, v) {
    const s = state.pr;

    if (a === 'sol') { s.sol = v; s.dipped = false; }
    if (a === 'dip') { s.dipped = !s.dipped; s.t0 = performance.now(); if (s.dipped) setTimeout(() => { if (state.pr === s) { renderCard(); const m = METALS_X.find(x => x.id === s.metal), so = SOLS.find(x => x.id === s.sol); if (SERIES.indexOf(m.id) < SERIES.indexOf(so.ion)) markDone('p-ionize'); } }, 1500); }
    renderCard();
  },
};

    [-1, 1].forEach(sg => { const tip = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.2, 0.24), metal(0xd7dbe0)); tip.position.set(sg * 0.35, -0.1, 0); magnet.add(tip); });

    R.tick = t => {

      if (s.phase === 'react' && e > 10) { s.phase = 'done'; renderCard(); markDone('p-fes'); }
      bm.flame.lit = s.phase === 'heat' || (s.phase === 'react' && !s.fireOff);
      bm.g.position.x = bm.flame.lit ? 1.1 : 1.7; bm.g.rotation.z = bm.flame.lit ? 0.3 : 0; // 手で持って傾け、混合物の上部に炎を当てる

// ---------- 気体の発生装置（ふたまた試験管・キップの装置） ----------
PR['p-kipp'] = {
  init() {
    const g = R.group;
    const s = { mode: (state.pr && state.pr.modeKeep) || 'y', tilt: 0, tiltT: 0, open: false, k: 0 };
    state.pr = s;
    // ふたまた試験管：左に固体（くびれあり）、右に液体

    const leg = (x, ang, neck) => {
      const lg = new THREE.Group();
      const inner = [];
      for (let k = 0; k <= 8; k++) { const a = -Math.PI / 2 + Math.PI / 2 * k / 8; inner.push([Math.cos(a) * 0.26, 0.28 + Math.sin(a) * 0.26]); }

      inner.push([0.26, 2.6]);

      lg.position.x = x; lg.rotation.z = ang; return lg;
    };
    const L = leg(-0.33, -0.12, true), Rr = leg(0.33, 0.12, false); // 下が開いた「人」の字の形
    yg.add(L, Rr);
    const top = shell([[0.26, 2.75], [0.24, 3.4], [0.27, 3.45]], 0.03); yg.add(top);
    const st = rubberStopper(0.28, 0.22, 0.3); st.position.y = 3.5; yg.add(st);
    yg.add(tubePath([[0, 3.6], [0, 4.0], [0.8, 4.2], [1.6, 3.8]], 0.05, glassMat({ opacity: 0.4 })));
    const zn = new THREE.Group(); for (let i = 0; i < 9; i++) { const z = new THREE.Mesh(new THREE.DodecahedronGeometry(0.07), metal(0x9aa2ab, 0.3)); z.position.set((Math.random() - 0.5) * 0.25, 0.15 + i * 0.05, (Math.random() - 0.5) * 0.2); zn.add(z); } L.add(zn);
    const acidR = liquid([[0, 0.04], [0.24, 0.28], [0.24, 2.6]], 0.9, 0xd9eef7); Rr.add(acidR);
    const acidL = liquid([[0, 0.04], [0.24, 0.28], [0.24, 2.6]], 0.75, 0xd9eef7); L.add(acidL);
    const ybub = bubbleSet(10, 0xffffff, 0.035); ybub.forEach(b => L.add(b));

    const ypiv = new THREE.Group(); ypiv.position.y = 3.6; yg.position.y = 0.45 - 3.6; ypiv.add(yg); g.add(ypiv);

    // キップの装置

    const lower = [[0, 0.1]].concat(sph(1.0, 0.9, -Math.PI / 2 + 0.1, Math.PI / 2 - 0.35), [[0.28, 1.95], [0.28, 2.15]]);
    const mid = sph(2.95, 0.8, -Math.PI / 2 + 0.35, Math.PI / 2 - 0.4).concat([[0.3, 3.8], [0.32, 3.85]]);
    kg.add(shell(lower, 0.04)); kg.add(shell([[0.3, 2.15]].concat(mid), 0.04));
    const topB = [[0.1, 3.95]].concat(sph(4.65, 0.65, -Math.PI / 2 + 0.2, Math.PI / 2 - 0.5), [[0.35, 5.35], [0.42, 5.42]]);
    kg.add(shell(topB, 0.035));
    const stem = cyl(0.07, 0.07, 4.2, glassMat({ opacity: 0.4 }), 12); stem.position.y = 2.15; kg.add(stem);
    const outlet = tubePath([[0.72, 2.95], [1.2, 2.95], [1.35, 3.0]], 0.06, glassMat({ opacity: 0.4 })); kg.add(outlet);
    const cockK = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.45, 0.1), solid(0x2b5fbf)); cockK.position.set(1.2, 2.95, 0); kg.add(cockK);
    const plate = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.03, 24), solid(0xd9d4c7)); plate.position.y = 2.32; kg.add(plate);
    const zn2 = new THREE.Group(); for (let i = 0; i < 26; i++) { const z = new THREE.Mesh(new THREE.DodecahedronGeometry(0.09), metal(0x9aa2ab, 0.3)); const a = Math.random() * 6.28, rr = 0.15 + Math.random() * 0.5; z.position.set(Math.cos(a) * rr, 2.42 + Math.random() * 0.25, Math.sin(a) * rr); zn2.add(z); } kg.add(zn2);
    const acidLow = new THREE.Group(), acidMid = new THREE.Group(), acidTop = new THREE.Group(); kg.add(acidLow, acidMid, acidTop);
    const kbub = bubbleSet(14, 0xffffff, 0.045); kbub.forEach(b => kg.add(b));
    kg.position.x = 0; g.add(kg);
    kg.add(withShadow(new THREE.Group(), 2.4));
    s.yg = yg; s.kg = kg;
    let lastLv = null;
    const setAcid = (grp, prof, h) => { while (grp.children.length) grp.remove(grp.children[0]); if (h > prof[0][1] + 0.02) grp.add(liquid(prof, h, 0xd9eef7)); };
    // ふたまた試験管の名前は、傾けても管についていくように管の座標で指す
    const onY = (x, y) => yg.localToWorld(new THREE.Vector3(x, y, 0));
    const labels = [['亜鉛（固体）', () => s.mode === 'y' ? onY(-0.3, 0.35) : new THREE.Vector3(0.7, 2.6, 0)], ['うすい塩酸', () => s.mode === 'y' ? (s.tiltT > 0.5 ? onY(-0.25, 0.7) : onY(0.36, 0.6)) : new THREE.Vector3(0.9, 0.9, 0)], ['くびれ', () => onY(-0.2, 1.25)], ['コック', () => new THREE.Vector3(1.25, 3.3, 0)]];
    s.lbl = labels.map(([n, f], i) => { const Lb = addLabel(n, f); Lb.part = true; Lb.el.hidden = !state.parts; Lb.idx = i; return Lb; });
    R.tick = t => {

        }

        kbub.forEach((b, i) => { b.visible = touching; const kk = (t * 1.0 + b.userData.ph) % 1; const a = i * 2.4; b.position.set(Math.cos(a) * 0.35, 2.45 + kk * 0.9, Math.sin(a) * 0.35); });
      }

  },
  html() {
    const s = state.pr;
    let h = `<div class="ctl"><div class="row"><button type="button" class="btn" data-kmode="y" aria-pressed="${s.mode === 'y'}">ふたまた試験管</button><button type="button" class="btn" data-kmode="k" aria-pressed="${s.mode === 'k'}">キップの装置</button></div>`;
    if (s.mode === 'y') {

// ===== 手順トレーニング（次にすることを選んで進める実験） =====
// SEQ[id] = { intro, purpose, steps: [{ do, why, wrong: [[まちがった操作, なぜだめか]] }], mistakes, danger, build(g) → { tick(t, k, e) }, frame }
const SEQ = {};
function seqOptions(def, k) {
  const st = def.steps[k];
  if (!st) return [];
  const o = [{ text: st.do, ok: true }];
  st.wrong.slice(0, 2).forEach(([text, why]) => o.push({ text, why }));
  // 先の手順を混ぜて「順番」も考えさせる
  const later = def.steps[k + 2] || def.steps[k + 1];
  if (o.length < 3 && later) o.push({ text: later.do, why: 'それはもう少しあとの手順。その前にやることがある。' });
  return shuffle(o);
}
function seqPractice(id) {
  const def = SEQ[id];
  return {
    init() {
      const s = { k: 0, tk: performance.now(), miss: 0, fb: null };
      s.opts = seqOptions(def, 0);
      state.pr = s;
      const api = def.build(R.group, s);
      R.tick = t => api.tick(t, s.k, (performance.now() - s.tk) / 1000);
      frame(...def.frame);
    },
    html() {
      const s = state.pr, n = def.steps.length, fin = s.k >= n;
      let h = `<div class="ctl">`;
      if (s.k === 0 && !s.fb) h += `<p class="use">${esc(def.intro)}</p>`;
      h += `<div class="seqhead"><span>手順 <b>${Math.min(s.k + 1, n)}</b> / ${n}</span><span class="note">ミス ${s.miss}</span></div><div class="qprog"><i style="width:${s.k / n * 100}%"></i></div>`;
      if (s.fb) h += `<div class="verdict ${s.fb.ok ? 'ok' : 'ng'}">${s.fb.ok ? '○ ' : '× '}${esc(s.fb.msg)}</div>`;
      if (!fin) {
        h += `<p class="qlead">次にすることは？</p><div class="seqopts">${s.opts.map((o, i) => `<button type="button" class="seqo" data-seq="${i}">${esc(o.text)}</button>`).join('')}</div>`;
      } else {
        h += `<div class="verdict ok">${s.miss === 0 ? 'ノーミスで完了！' : `完了！（ミス ${s.miss} 回）`} 「手順」タブの「ならべかえ」でも確かめよう。</div>
          <div class="row"><button type="button" class="btn" data-a="seqreset">もう一度</button><button type="button" class="btn main" data-ptab="steps">手順をふり返る</button></div>`;
      }
      if (s.k > 0) h += `<details class="donelist"><summary>ここまでの手順（${s.k}）</summary><ol>${def.steps.slice(0, s.k).map(st => `<li>${esc(st.do)}</li>`).join('')}</ol></details>`;
      return h + '</div>';
    },
    act(a, v) {
      const s = state.pr;
      if (a === 'seqreset') { clearScene(); this.init(); renderCard(); return; }
      if (a === 'seq') {
        const o = s.opts[+v];
        if (!o) return;
        if (o.ok) {
          const st = def.steps[s.k];
          s.fb = { ok: true, msg: st.why };
          s.k++; s.tk = performance.now();
          s.opts = seqOptions(def, s.k);
          if (s.k >= def.steps.length) markDone(id);
        } else { s.miss++; s.fb = { ok: false, msg: o.why }; }
        renderCard();

function powder(n, color, spread, y0, y1, size) {
  const g = new THREE.Group(), mat = solid(color, { shininess: 10 });
  const geo = new THREE.DodecahedronGeometry(size || 0.035);
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(geo, mat);
    const a = Math.random() * 6.28, r = Math.sqrt(Math.random()) * spread;
    m.position.set(Math.cos(a) * r, y0 + Math.random() * (y1 - y0) * (1 - r / spread * 0.6), Math.sin(a) * r);
    g.add(m);
  }
  return g;
}
const lerp = (a, b, k) => a + (b - a) * Math.max(0, Math.min(1, k));

      if (k >= 1) { x.strokeStyle = '#555'; x.lineWidth = 2; x.beginPath(); x.moveTo(6, Y(o)); x.lineTo(90, Y(o)); x.stroke(); }
      if (k >= 2) {
        const dyes = [['#f2c200', 0.86], ['#e0307a', 0.6], ['#2f5fd0', 0.32], ['#222', 0.0]];
        dyes.forEach(([col, rf]) => {
          const y = o + (front - o) * rf, sp = 6 + 26 * p * (rf > 0 ? 0.6 + rf * 0.4 : 0.2);
          const grd = x.createRadialGradient(48, Y(y), 1, 48, Y(y), sp);
          grd.addColorStop(0, col); grd.addColorStop(1, 'rgba(255,255,255,0)');
          x.globalAlpha = p > 0 || rf === 0 ? 0.85 : 0; if (p === 0 && rf === 0) x.globalAlpha = 1;
          x.fillStyle = grd; x.beginPath(); x.ellipse(48, Y(y), sp * 1.1, sp * 0.8, 0, 0, 6.29); x.fill();
        });
        x.globalAlpha = 1;
      }
      if (k >= 5) { x.strokeStyle = '#555'; x.setLineDash([4, 3]); x.beginPath(); x.moveTo(6, Y(front)); x.lineTo(90, Y(front)); x.stroke(); x.setLineDash([]); }
      tex.needsUpdate = true;
    };
    let last = '';
    const L = addLabel('ろ紙', () => (hang.rotation.x ? new THREE.Vector3(2.0, 0.1, -0.6) : new THREE.Vector3(0.45, 1.6, 0))); L.part = true; L.el.hidden = !state.parts;
    const L2 = addLabel('展開液', () => new THREE.Vector3(0.9, 0.3, 0.3)); L2.part = true; L2.el.hidden = !state.parts;
    return {
      tick(t, k, e) {
        solv.visible = k >= 3;
        lid.visible = k >= 4;
        const inJar = k === 4;
        if (inJar) { hang.rotation.x = 0; hang.position.set(0, 0.38, 0); } else { hang.rotation.x = -Math.PI / 2; hang.position.set(1.5, 0.03, 1.3); }
        rod.visible = clip.visible = inJar;
        const p = k >= 5 ? 1 : k === 4 ? Math.min(1, e / 7) : 0;
        const key = k + ':' + p.toFixed(2);
        if (key !== last) { draw(k, p); last = key; }
      },
    };
  },
};

}
function orderPick(i) {

  if (ord) { if (ord.dataset.order === 'close') state.order = null; else orderStart(); renderCard(); return; }
  const opk = t.closest('[data-opick]');
  if (opk && state.order) { orderPick(+opk.dataset.opick); renderCard(); return; }
  const ptab = t.closest('[data-ptab]');
  if (ptab) { state.ptab = ptab.dataset.ptab; renderCard(); const b = $('card').querySelector('.body'); if (b) b.scrollTop = 0; return; }
  const tab = t.closest('[data-tab]');
  if (tab) { state.tab = tab.dataset.tab; renderCard(); return; }
  const pk = t.closest('[data-pick]');
  if (pk && state.quiz) { const q = state.quiz.qs[state.quiz.i]; state.quiz.picked = q.choices[+pk.dataset.pick]; if (state.quiz.picked === q.answer) state.quiz.score++; renderCard(); return; }
  const a = t.closest('[data-a]');
  if (a) {
    if (a.dataset.a === 'qnext') { state.quiz.i++; state.quiz.picked = null; if (state.quiz.i >= 10) renderCard(); else quizShow(); return; }
    PR[state.id].act(a.dataset.a); return;
  }
  for (const [attr, act] of [['data-gas', 'gas'], ['data-method', 'method'], ['data-elyte', 'elyte'], ['data-sample', 'sample'], ['data-fq', 'fq'], ['data-metal', 'metal'], ['data-sol', 'sol'], ['data-fs', 'fs'], ['data-kmode', 'kmode'], ['data-add', 'add'], ['data-seq', 'seq']]) {
    const b = t.closest('[' + attr + ']');
    if (b && state.pr) { PR[state.id].act(act, b.getAttribute(attr)); return; }
  }
  const eye = t.closest('[data-eye]');
  if (eye) { PR[state.id].act('eye', eye.dataset.eye); return; }
  const opt = t.closest('[data-opt]');
  if (opt) { PR[state.id].act('opt', opt.dataset.opt); return; }
  const set = t.closest('[data-set]');
  if (set) { PR[state.id].act('set', set.dataset.set); return; }
});
document.addEventListener('input', ev => {
  const id = ev.target.id, v = +ev.target.value;
  const map = { gasS: 'gas', airS: 'air', amtS: 'amt', wickS: 'wick', fillS: 'fill', tubeS: 'amt', voltS: 'volt', cuS: 'cu', rcS: 'rc' };
  if (map[id] && state.pr) {
    PR[state.id].act(map[id], v);
    const el = $(id); if (el) el.focus();
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.id === 'readV') PR['p-cylinder'].act('judge'); if (ev.key === 'Enter' && ev.target.id === 'tAns') PR['p-titr'].act('tjudge'); });
$('btnParts').addEventListener('click', () => {
  state.parts = !state.parts;
  $('btnParts').setAttribute('aria-pressed', String(state.parts));
  if (R) R.labels.forEach(L => { if (L.part) L.el.hidden = !state.parts; });
});
$('btnReset').addEventListener('click', () => { if (state.mode === 'practice' && state.id === 'p-cylinder') PR['p-cylinder'].view(); else if (state.mode === 'practice') go('practice', state.id); else if (state.mode === 'see') showItem(state.id); });
$('btnFull').addEventListener('click', () => {
  const w = $('stageWrap');
  if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
  if (w.requestFullscreen) w.requestFullscreen().catch(() => w.classList.toggle('is-max')); else w.classList.toggle('is-max');
});

// ===== はじめる =====
(function start() {
  const ok = initThree();
  if (!ok) $('stage').innerHTML = '<div class="fallback">3D表示の部品（three.js）を読み込めませんでした。<br>インターネットにつながっているか確認して、開き直してください。</div>';
  let h = '';
  try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) { /* 無視 */ }
  if (PRACTICES.some(p => p.id === h)) go('practice', h);
  else if (ITEMS.some(x => x.id === h)) go('see', h);
  else go('see', 'beaker');
})();
</script>
