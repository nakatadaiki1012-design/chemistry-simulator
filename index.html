// 表示モード・トグルの反映
function applyLook() {
  const e = state.entry, m = e.model, an = e.an;
  const polar = state.show.polar && !e.crystal && !e.custom;
  m.atoms.forEach((a, i) => {
    view.atoms[i].scale.setScalar(atomRadius(i));
    view.atoms[i].material.color.set(polar ? deltaColor(an.delta[i]) : EL[a.el].c);
  });
  view.bonds.forEach(item => {
    const st = BOND_STYLE[item.kind];
    const visible = state.mode !== 'space' || st.dashed;
    item.dashes.forEach(x => { x.visible = visible; });
    item.lines.forEach(pair => pair.forEach((mesh, k) => {
      mesh.visible = visible;
      if (state.show.btype) mesh.material.color.set(st.color);
      else if (polar) mesh.material.color.set('#c4cad4');
      else mesh.material.color.set(EL[m.atoms[k ? item.b.b : item.b.a].el].c);
    }));
  });
  const lpOn = state.show.lp && state.mode !== 'space';
  view.lps.forEach(v => { v.grp.visible = lpOn; });
  if (view.cloud) { view.cloud.obj.visible = !!state.show.cloud; colorCloud(); }
  if (view.dipole) { view.dipole.grp.visible = state.show.polar; view.dipole.L.el.hidden = !state.show.polar; }
  view.labels.forEach(L => {
    if (L.kind !== 'atom') return;
    const a = m.atoms[L.i];
    let html = esc(a.el);
    if (a.charge) html += '<sup>' + chargeSup(a.charge) + '</sup>';
    if (e.kind === 'build' && state.bld) { const f = bldFree(L.i); if (f > 0) html += `<span class="free">${f}</span>`; }
    if (polar) {
      const d = an.delta[L.i];
      if (d < -0.3) html += '<sup>δ−</sup>'; else if (d > 0.3) html += '<sup>δ+</sup>';
    }
    L.el.innerHTML = html;
    L.el.hidden = !state.show.labels;
  });
  rebuildArcs();
  updatePositions(performance.now() / 1000);
  renderLegend();
}

function rebuildArcs() {
  view.arcs.forEach(a => { R.group.remove(a.line); a.line.geometry.dispose(); a.line.material.dispose(); a.L.el.remove(); view.labels.splice(view.labels.indexOf(a.L), 1); });
  view.arcs = [];
  const m = state.entry.model;
  if (m.crystal && state.selected < 0) return;
  const want = [];
  if (state.show.angle && !m.crystal) {
    m.atoms.forEach((a, c) => {
      if (want.length >= 8 || a.el === 'H' || m.nb[c].length < 2) return;
      want.push([c, m.nb[c][0].j, m.nb[c][1].j]);
    });
  }
  if (state.selected >= 0 && state.entry.kind !== 'build') {
    const c = state.selected, nb = m.nb[c];
    let n = 0;
    for (let i = 0; i < nb.length && n < 6; i++) for (let j = i + 1; j < nb.length && n < 6; j++) {
      if (!want.some(w => w[0] === c && ((w[1] === nb[i].j && w[2] === nb[j].j) || (w[1] === nb[j].j && w[2] === nb[i].j)))) want.push([c, nb[i].j, nb[j].j]);
      n++;
    }
  }
  const color = cssVar('--accent') || '#2753d6';
  want.forEach(([c, a, b]) => {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(25 * 3), 3));
    const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color, depthTest: false, transparent: true }));
    line.renderOrder = 15;
    R.group.add(line);
    const arc = { c, a, b, line, mid: new THREE.Vector3() };
    arc.L = addLabel('lbl-angle', '', () => arc.mid);
    view.arcs.push(arc);
  });
}

function updatePositions(t) {
  const e = state.entry, m = e.model;
  if (e.anim === 'dative') datTick(state.demo.tau);
  const vibOn = state.show.vib;
  view.base.forEach((b, i) => {
    const c = view.cur[i];
    c.copy(b);
    if (vibOn) {
      const v = view.vib[i];
      c.x += v.amp * Math.sin(v.w[0] * t + v.ph[0]);
      c.y += v.amp * Math.sin(v.w[1] * t + v.ph[1]);
      c.z += v.amp * Math.sin(v.w[2] * t + v.ph[2]);
    }
    view.atoms[i].position.copy(c);
  });
  const stick = state.mode === 'stick', space = state.mode === 'space';
  if (view.dashLines && (vibOn || !view.dashLines.done)) {
    const arr = view.dashLines.obj.geometry.attributes.position.array;
    view.dashLines.items.forEach((it, k) => {
      const A = view.cur[it.b.a], B = view.cur[it.b.b];
      arr.set([A.x, A.y, A.z, B.x, B.y, B.z], k * 6);
    });
    view.dashLines.obj.geometry.attributes.position.needsUpdate = true;
    view.dashLines.obj.computeLineDistances();
    view.dashLines.done = true;
  }
  if (view.cloud && view.cloud.obj.visible) {
    const c = view.cloud, arr = c.obj.geometry.attributes.position.array;
    const ang = t * 0.6, ca = Math.cos(ang), sa = Math.sin(ang);
    for (let k = 0; k < c.owner.length; k++) {
      const o = view.cur[c.owner[k]], x = c.offs[k * 3], y = c.offs[k * 3 + 1], z = c.offs[k * 3 + 2];
      arr[k * 3] = o.x + x * ca - z * sa; arr[k * 3 + 1] = o.y + y; arr[k * 3 + 2] = o.z + x * sa + z * ca;
    }
    c.obj.geometry.attributes.position.needsUpdate = true;
  }
  view.bonds.forEach(item => {
    if (item.inLine) return;
    const b = item.b, A = view.cur[b.a], B = view.cur[b.b];
    if (item.dashes.length) {
      const D = item.dashes.length, L = A.distanceTo(B);
      const dir = new THREE.Vector3().subVectors(B, A).normalize();
      const r = item.kind === 'ionic' ? 0.045 : 0.04;
      item.dashes.forEach((mesh, d) => {
        const p0 = A.clone().addScaledVector(dir, L * (d + 0.2) / D), p1 = A.clone().addScaledVector(dir, L * (d + 0.8) / D);
        placeCyl(mesh, p0, p1, r);
      });
      return;
    }
    const pairsOn = !!(state.show.pairs || item.forceDots) && !space;
    const n = item.lines.length;
    const r = pairsOn ? 0.045 : n === 1 ? (stick ? 0.15 : 0.1) : (stick ? 0.085 : 0.062);
    const gap = stick ? 0.22 : 0.18;
    const dir = new THREE.Vector3().subVectors(B, A).normalize();
    let perp = null;
    const ref = m.nb[b.a].find(x => x.j !== b.b) || m.nb[b.b].find(x => x.j !== b.a);
    if (ref && n > 1) {
      const v = new THREE.Vector3().subVectors(view.cur[ref.j], A);
      const normal = new THREE.Vector3().crossVectors(dir, v);
      if (normal.lengthSq() > 1e-6) perp = new THREE.Vector3().crossVectors(normal, dir).normalize();
    }
    if (!perp) perp = new THREE.Vector3().crossVectors(dir, Math.abs(dir.y) < 0.9 ? UP : new THREE.Vector3(1, 0, 0)).normalize();
    const mid = new THREE.Vector3().addVectors(A, B).multiplyScalar(0.5);
    item.lines.forEach((p, k) => {
      const off = perp.clone().multiplyScalar((k - (n - 1) / 2) * gap);
      const a1 = A.clone().add(off), m1 = mid.clone().add(off), b1 = B.clone().add(off);
      placeCyl(p[0], a1, m1, r);
      placeCyl(p[1], m1, b1, r);
      if (!item.dots[k]) return;
      const [d1, d2] = item.dots[k];
      d1.visible = d2.visible = pairsOn && p[0].visible;
      if (pairsOn) {
        d1.position.copy(m1).addScaledVector(dir, 0.1); d1.scale.setScalar(0.075);
        d2.position.copy(m1).addScaledVector(dir, -0.1); d2.scale.setScalar(0.075);
      }
    });
  });
  view.lps.forEach(v => {
    const o = v.l.owner;
    v.dir.set(v.l.p[0], v.l.p[1], v.l.p[2]).sub(view.base[o]).normalize();
    v.grp.position.copy(view.cur[o]).addScaledVector(v.dir, atomRadius(o) + 0.2);
    v.grp.quaternion.setFromUnitVectors(UP, v.dir);
  });
  if (view.fakeLp && view.dat) {
    const N = view.dat.N;
    view.fakeLp.position.copy(view.cur[N]).addScaledVector(view.dat.dir, atomRadius(N) + 0.2);
    view.fakeLp.quaternion.setFromUnitVectors(UP, view.dat.dir);
  }
  view.free.forEach(f => {
    f.mesh.position.set(f.h * Math.sin(f.w[0] * t + f.ph[0]), f.h * Math.sin(f.w[1] * t + f.ph[1]), f.h * Math.sin(f.w[2] * t + f.ph[2]));
  });
  if (state.selected >= 0 && view.halo) {
    view.halo.visible = true;
    view.halo.position.copy(view.cur[state.selected]);
    view.halo.scale.setScalar(atomRadius(state.selected) * 1.18 + 0.05);
  } else if (view.halo) view.halo.visible = false;
  view.arcs.forEach(arc => {
    const C = view.cur[arc.c], A = view.cur[arc.a], B = view.cur[arc.b];
    const u = new THREE.Vector3().subVectors(A, C).normalize(), w = new THREE.Vector3().subVectors(B, C).normalize();
    const ang = Math.acos(Math.max(-1, Math.min(1, u.dot(w))));
    const rad = space ? atomRadius(arc.c) + 0.3 : Math.max(0.55, atomRadius(arc.c) + 0.2);
    const arr = arc.line.geometry.attributes.position.array;
    let axis = new THREE.Vector3().crossVectors(u, w);
    if (axis.lengthSq() < 1e-8) axis = new THREE.Vector3().crossVectors(u, Math.abs(u.y) < 0.9 ? UP : new THREE.Vector3(1, 0, 0));
    axis.normalize();
    for (let k = 0; k < 25; k++) {
      const q = new THREE.Quaternion().setFromAxisAngle(axis, ang * k / 24);
      const p = u.clone().applyQuaternion(q).multiplyScalar(rad).add(C);
      arr[k * 3] = p.x; arr[k * 3 + 1] = p.y; arr[k * 3 + 2] = p.z;
    }
    arc.line.geometry.attributes.position.needsUpdate = true;
    arc.mid.copy(u).applyQuaternion(new THREE.Quaternion().setFromAxisAngle(axis, ang / 2)).multiplyScalar(rad + 0.38).add(C);
    arc.L.el.textContent = (ang * 180 / Math.PI).toFixed(1) + '°';
  });
}

// ===== 原子（ボーア模型：原子核と電子殻） =====
const SHELL_R = [0.85, 1.45, 2.05, 2.65, 3.25, 3.85, 4.45];
function makeBohr(el, opts) {
  const o = Object.assign({ scale: 1, slots: null }, opts || {});
  const s = o.scale, Z = EL[el].z, nN = neutronsOf(el);
  const grp = new THREE.Group();
  // 原子核：陽子（赤）と中性子（灰）
  const nuc = new THREE.Group();
  const total = Z + nN, rr = Math.min(0.085 * s * Math.max(1, Math.cbrt(Z) * 0.8), 0.6 * s / (Math.cbrt(total) * 0.95)); // 大きな原子核でもK殻の内側におさめる
  const Rn = rr * Math.cbrt(total) * 0.95;
  const r2 = rng(Z * 97 + 3);
  const kinds = [];
  for (let i = 0; i < total; i++) kinds.push(i < Z ? 'p' : 'n');
  for (let i = kinds.length - 1; i > 0; i--) { const j = Math.floor(r2() * (i + 1)); [kinds[i], kinds[j]] = [kinds[j], kinds[i]]; }
  const ga = Math.PI * (3 - Math.sqrt(5));
  kinds.forEach((k, i) => {
    const rad = total === 1 ? 0 : Rn * Math.cbrt((i + 0.5) / total);
    const y = 1 - 2 * (i + 0.5) / total, rxy = Math.sqrt(1 - y * y);
    const mesh = new THREE.Mesh(R.SMALL, phong(k === 'p' ? '#e8503a' : '#b4bccb'));
    mesh.scale.setScalar(rr);
    mesh.position.set(Math.cos(ga * i) * rxy * rad, y * rad, Math.sin(ga * i) * rxy * rad);
    nuc.add(mesh);
  });
  grp.add(nuc);
  const shells = SHELL_R.map((r0, i) => {
    const r = r0 * s;
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r, 0.014 * s + 0.004, 8, 160), basic(cssVar('--ring') || '#8090a8', { transparent: true, opacity: 0.85 }));
    grp.add(ring);
    return { r, ring, pool: [], speed: 1.1 / (i + 1), ph: i * 0.7 };
  });
  const bohr = { el, grp, shells, counts: elemShells(Z), slots: o.slots, s, opacity: [1, 1, 1, 1, 1, 1, 1], trans: null };
  bohr.electronPos = (i, k, n, t) => {
    const sh = shells[i], ang = sh.ph + t * sh.speed + 2 * Math.PI * k / Math.max(n, 1);
    return new THREE.Vector3(Math.cos(ang) * sh.r, Math.sin(ang) * sh.r, 0);
  };
  const getE = (i, k) => {
    const sh = shells[i];
    while (sh.pool.length <= k) {
      const mesh = new THREE.Mesh(R.SMALL, basic(ELECTRON_COLOR, { transparent: true }));
      grp.add(mesh); sh.pool.push(mesh);
    }
    return sh.pool[k];
  };
  bohr.outer = () => { let o2 = -1; bohr.counts.forEach((c, i) => { if (c) o2 = i; }); return o2; };
  bohr.update = (t, now) => {
    const outer = bohr.outer();
    let tr = bohr.trans, p = 1;
    if (tr) { p = clamp01((now - tr.start) / tr.dur); if (p >= 1) { bohr.trans = null; tr = null; } }
    shells.forEach((sh, i) => {
      const n = bohr.counts[i];
      const slots = (bohr.slots && bohr.slots[i]) || n;
      let used = 0;
      for (let k = 0; k < n; k++) {
        const m = getE(i, used++);
        m.visible = true; m.material.opacity = 1;
        m.material.color.set(i === outer ? ELECTRON_COLOR : INNER_ELECTRON_COLOR);
        m.scale.setScalar((i === outer ? 0.11 : 0.08) * s);
        const target = bohr.electronPos(i, k, slots, t);
        if (tr && tr.to[i] > tr.from[i] && k >= tr.from[i]) {
          const dir = target.clone().normalize();
          m.position.copy(dir.multiplyScalar(5.2 * s)).lerp(target, ease(p));
        } else m.position.copy(target);
      }
      if (tr && tr.from[i] > tr.to[i]) {
        for (let k = tr.to[i]; k < tr.from[i]; k++) {
          const m = getE(i, used++);
          const start = bohr.electronPos(i, k, tr.from[i], tr.t0);
          m.visible = true;
          m.material.color.set(ELECTRON_COLOR);
          m.material.opacity = 1 - ease(p);
          m.scale.setScalar(0.11 * s);
          m.position.copy(start).multiplyScalar(1 + 2.6 * ease(p));
        }
      }
      for (let k = used; k < sh.pool.length; k++) sh.pool[k].visible = false;
      const empty = n === 0 && !(bohr.slots && bohr.slots[i]) && !(tr && (tr.from[i] || tr.to[i]));
      const wanted = (bohr.slots && bohr.slots[i]) || n || (tr && Math.max(tr.from[i], tr.to[i]));
      sh.ring.visible = !!wanted || i <= outer;
      sh.ring.material.opacity = (empty ? 0.18 : 0.85) * bohr.opacity[i];
    });
  };
  bohr.setCounts = (to, anim) => {
    if (anim) bohr.trans = { from: bohr.counts.slice(), to: to.slice(), start: anim.now, dur: anim.dur || 1.3, t0: anim.t };
    bohr.counts = to.slice();
  };
  return bohr;
}

function buildAtomView() {
  const e = state.entry;
  view.kind = 'atom';
  const Z = EL[e.el].z;
  const bohr = makeBohr(e.el);
  R.group.add(bohr.grp);
  view.bohr = bohr;
  const ion = ionOf(e.el);
  if (state.atomIon && ion !== undefined) bohr.setCounts(ionShells(e.el, ion));
  bohr.shells.forEach((sh, i) => {
    // 殻の名前は少しずつ角度をずらして、重ならないようにする
    const th = Math.PI / 4 - (i - 1) * 0.3;
    const L = addLabel('lbl-shell', '', () => new THREE.Vector3(sh.r * Math.cos(th), sh.r * Math.sin(th), 0));
    L.shell = i;
  });
  const qq = state.quizActive && state.quiz ? state.quiz.qs[state.quiz.i] : null;
  view.nucLabel = addLabel('lbl-nuc', qq && qq.hideNuc ? '原子核<br><b>?</b>' : `原子核<br><b>+${Z}</b>`, () => new THREE.Vector3(0, -0.72, 0));
  if (qq && qq.hideShells) view.labels.forEach(L => { if (L.shell !== undefined) L.quizHide = true; });
  // 電子雲モード：殻のあたりに電子が雲のように広がっている様子
  const cloudGeo = new THREE.BufferGeometry();
  const cloud = new THREE.Points(cloudGeo, new THREE.PointsMaterial({ size: 0.1, map: dotTexture(), transparent: true, opacity: 0.7, depthWrite: false, vertexColors: true }));
  R.group.add(cloud);
  let cloudKey = '';
  const makeCloud = counts => {
    const r = rng(5), pos = [], col = [];
    let outer = -1; counts.forEach((c, i) => { if (c) outer = i; });
    const cOut = new THREE.Color('#ffb400'), cIn = new THREE.Color('#7f9cff');
    counts.forEach((c, i) => {
      for (let k = 0; k < c * 420; k++) {
        const dir = randDir(r), rad = SHELL_R[i] * (1 + gauss(r) * 0.13);
        pos.push(dir[0] * rad, dir[1] * rad, dir[2] * rad);
        const cc = i === outer ? cOut : cIn;
        col.push(cc.r, cc.g, cc.b);
      }
    });
    cloudGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    cloudGeo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  };
  view.tick = (t, now) => {
    bohr.update(t, now);
    const isCloud = state.atomView === 'cloud';
    cloud.visible = isCloud;
    if (isCloud) {
      const key = bohr.counts.join(',');
      if (key !== cloudKey) { makeCloud(bohr.counts); cloudKey = key; }
      cloud.rotation.y = t * 0.25; cloud.rotation.x = t * 0.11;
      bohr.shells.forEach(sh => { sh.ring.visible = false; sh.pool.forEach(m => { m.visible = false; }); });
    }
    view.labels.forEach(L => {
      if (L.shell === undefined) return;
      const n = bohr.counts[L.shell];
      const show = n > 0 || (bohr.trans && bohr.trans.from[L.shell] > 0) || L.shell <= bohr.outer();
      L.el.hidden = !show;
      L.el.innerHTML = L.quizHide ? `${SHELL_NAMES[L.shell]}殻` : `${SHELL_NAMES[L.shell]}殻 <b>${n}</b>`;
    });
  };
  renderLegend();
}

function buildDemoView() {
  const e = state.entry;

  const g = R.group;
  if (e.demo === 'ionic') {
    const s = 0.75;
    const na = makeBohr('Na', { scale: s }), cl = makeBohr('Cl', { scale: s, slots: [0, 0, 8, 0] });
    g.add(na.grp, cl.grp);
    const fly = new THREE.Mesh(R.SMALL, basic(ELECTRON_COLOR)); fly.scale.setScalar(0.11 * s); g.add(fly);
    const arrows = [-1, 1].map(sg => {
      const a = new THREE.Mesh(R.CONE, basic(BOND_STYLE.ionic.color)); a.scale.set(0.16, 0.42, 0.16);
      a.rotation.z = sg > 0 ? Math.PI / 2 : -Math.PI / 2; g.add(a); return a;
    });

    const lForce = addLabel('lbl-force', '引き合う（クーロン力）', () => new THREE.Vector3((na.grp.position.x + cl.grp.position.x) / 2, -2.4 * s, 0));
    addLabel('lbl-shell', 'M殻', () => na.grp.position.clone().add(new THREE.Vector3(SHELL_R[2] * s * 0.72, SHELL_R[2] * s * 0.72, 0)));

      na.opacity[2] = 1 - phase(tau, 3.6, 4.4) * 0.9;
      na.update(tau); cl.update(tau);
      fly.visible = moving;
      if (moving) {
        const p = ease(phase(tau, 1.6, 3.6));
        const a = na.electronPos(2, 0, 1, 1.6).add(na.grp.position);
        const b = cl.electronPos(2, 7, 8, 3.6).add(cl.grp.position);
        const ctrl = new THREE.Vector3((a.x + b.x) / 2, 2.6, 0);
        fly.position.set(
          (1 - p) * (1 - p) * a.x + 2 * (1 - p) * p * ctrl.x + p * p * b.x,
          (1 - p) * (1 - p) * a.y + 2 * (1 - p) * p * ctrl.y + p * p * b.y, 0);
      }

      lNa.el.innerHTML = ionized ? 'Na<sup>+</sup>' : 'Na';
      lCl.el.innerHTML = ionized ? 'Cl<sup>−</sup>' : 'Cl';
      lNa.el.classList.toggle('pos', ionized); lCl.el.classList.toggle('neg', ionized);
      const show = tau >= 5.6;
      const pulse = 1 + 0.15 * Math.sin(tau * 6);

        const mid = (na.grp.position.x + cl.grp.position.x) / 2;
        ar.position.set(mid + (k ? -0.55 : 0.55) * pulse, -2.4 * s + 0.45, 0);
      });
      lForce.el.hidden = !show;
    };
  } else if (e.demo === 'covalent') {
    const h1 = makeBohr('H', { slots: [2, 0, 0, 0] }), h2 = makeBohr('H', { slots: [2, 0, 0, 0] });
    g.add(h1.grp, h2.grp);
    const glow = new THREE.Mesh(R.SPHERE, basic(ELECTRON_COLOR, { transparent: true, opacity: 0.18, depthWrite: false }));
    glow.scale.set(0.32, 0.62, 0.32); g.add(glow);
    const shared = [0, 1].map(() => { const m = new THREE.Mesh(R.SMALL, basic(ELECTRON_COLOR)); m.scale.setScalar(0.11); g.add(m); return m; });
    const lPair = addLabel('lbl-force pair', '共有電子対', () => new THREE.Vector3(0, 1.05, 0));
    const l1 = addLabel('lbl-ion', 'H', () => h1.grp.position.clone().add(new THREE.Vector3(0, -1.35, 0)));
    const l2 = addLabel('lbl-ion', 'H', () => h2.grp.position.clone().add(new THREE.Vector3(0, -1.35, 0)));
    view.tick = tau => {
      const p = ease(phase(tau, 1.6, 3.6));
      h1.grp.position.set(-2.3 + 1.75 * p, 0, 0);
      h2.grp.position.set(2.3 - 1.75 * p, 0, 0);
      const q = ease(phase(tau, 3.8, 5.0));
      h1.setCounts([q > 0 ? 0 : 1, 0, 0, 0]); h2.setCounts([q > 0 ? 0 : 1, 0, 0, 0]);
      h1.update(tau); h2.update(tau);
      [h1, h2].forEach((h, k) => {
        const from = h.electronPos(0, 0, 1, tau).add(h.grp.position);
        const wob = 0.06 * Math.sin(tau * 5 + k * 3);
        const to = new THREE.Vector3(wob, k ? -0.3 : 0.3, 0);
        shared[k].visible = q > 0;
        shared[k].position.copy(from).lerp(to, q);
      });
      glow.visible = q > 0.6;
      glow.material.opacity = 0.18 * phase(tau, 4.4, 5.0);
      lPair.el.hidden = q < 1;
      l1.el.innerHTML = l2.el.innerHTML = 'H';
      const bonded = tau >= 5.6;
      l1.el.hidden = l2.el.hidden = false;
      if (bonded) { l1.el.innerHTML = 'H'; }
      [h1, h2].forEach(h => { h.shells[0].ring.material.color.set(bonded ? ELECTRON_COLOR : (cssVar('--ring') || '#8090a8')); });
    };
  } else if (e.demo === 'metal') {
    const cores = [], electrons = [];
    const rows = 3, cols = 4, gap = 2.6;
    const r2 = rng(7);
    for (let i = 0; i < rows; i++) for (let j = 0; j < cols; j++) {
      const c = new THREE.Vector3((j - (cols - 1) / 2) * gap, ((rows - 1) / 2 - i) * gap, 0);
      const core = new THREE.Mesh(R.SPHERE, phong(EL.Na.c)); core.scale.setScalar(0.55); core.position.copy(c); g.add(core);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.014, 8, 100), basic(cssVar('--ring') || '#8090a8', { transparent: true, opacity: 0.85 }));
      ring.position.copy(c); g.add(ring);
      const em = new THREE.Mesh(R.SMALL, basic(ELECTRON_COLOR)); em.scale.setScalar(0.12); g.add(em);
      const L = addLabel('lbl-core', 'Na', () => c);
      cores.push({ c, ring, L });
      electrons.push({ m: em, c, ph: r2() * 6.28, w: [0, 1, 2].map(() => 0.35 + r2() * 0.6), q: [0, 1, 2].map(() => r2() * 6.28) });
    }
    const hx = (cols - 1) / 2 * gap + 0.8, hy = (rows - 1) / 2 * gap + 0.8;
    view.tick = tau => {
      const free = ease(phase(tau, 1.6, 3.4));
      cores.forEach(k => {
        k.ring.material.opacity = 0.85 * (1 - free) + 0.05;
        k.L.el.innerHTML = tau >= 2.6 ? 'Na<sup>+</sup>' : 'Na';
      });
      electrons.forEach(ev => {
        const a = ev.ph + tau * 1.2;
        const orbit = new THREE.Vector3(Math.cos(a), Math.sin(a), 0).add(ev.c);
        const wander = new THREE.Vector3(hx * Math.sin(ev.w[0] * tau + ev.q[0]), hy * Math.sin(ev.w[1] * tau + ev.q[1]), 0.9 * Math.sin(ev.w[2] * tau + ev.q[2]));
        ev.m.position.copy(orbit).lerp(wander, free);
      });
    };
  }
  renderLegend();
}

// ===== 物質量（mol）：粒子の数・質量・体積を目で見る =====
const NA = 6.0e23, VM = 22.4;
function moleNumbers(e, n) {
  const M = massOf(e.counts).total;
  const mass = n * M;
  return { M, n, mass, count: n * NA, gasL: n * VM, mL: e.density ? mass / e.density : null };
}
function moleTemplate(e) {
  if (e.model === 'atom') return [{ el: e.f, p: [0, 0, 0], r: EL[e.f].rv * 0.62 }];
  if (e.model === 'pair') return [{ el: 'Na', p: [-0.6, 0, 0], r: 1.02 }, { el: 'Cl', p: [0.75, 0, 0], r: 1.81 }];
  const src = getModel(LIB.find(x => x.id === e.model)).model;
  return src.atoms.map((a, i) => ({ el: a.el, p: src.pos[i], r: EL[a.el].rv }));
}
function buildMoleView(keepCamera) {
  const e = state.entry, g = R.group;
  view.kind = 'mole';
  const num = moleNumbers(e, state.mole.n);
  const k = Math.max(1, Math.min(50, Math.round(state.mole.n * 10)));
  const tpl = moleTemplate(e);
  const s = e.model === 'atom' ? 0.42 : e.model === 'pair' ? 0.3 : 0.3;
  const mats = {};
  const mat = el => mats[el] || (mats[el] = phong(EL[el].c));
  const icons = [];
  for (let i = 0; i < k; i++) {
    const grp = new THREE.Group();
    tpl.forEach(a => {
      const m = new THREE.Mesh(R.SMALL, mat(a.el));
      m.scale.setScalar(a.r * s);
      m.position.set(a.p[0] * s, a.p[1] * s, a.p[2] * s);
      grp.add(m);
    });
    g.add(grp);
    icons.push(grp);
  }
  const r = rng(11);
  const lineMat = c => new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: 0.9 });
  const boxAt = (side, center, color, fill) => {
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(side, side, side)), lineMat(color));
    edges.position.copy(center); g.add(edges);
    if (fill) {
      const f = new THREE.Mesh(new THREE.BoxGeometry(side, side, side), basic(color, { transparent: true, opacity: 0.07, depthWrite: false }));
      f.position.copy(center); g.add(f);
    }
  };
  const accent = cssVar('--accent') || '#2753d6', muted = cssVar('--muted') || '#5a6577';
  const UNIT = 4;  // 3D空間の1目盛り = 4 cm
  const ref = 10 / UNIT;  // 1 L（一辺10 cm）の箱
  view.moleLabels = [];
  if (e.phase === 'gas') {
    const side = Math.cbrt(num.gasL * 1000) / UNIT;
    const c = new THREE.Vector3(0, side / 2, 0);
    boxAt(side, c, accent, true);
    boxAt(ref, new THREE.Vector3(side / 2 + 1.2 + ref / 2, ref / 2, 0), muted, false);
    addLabel('lbl-mol big', `${fmtNum(num.gasL)} L`, () => new THREE.Vector3(0, side + 0.6, 0));
    addLabel('lbl-mol', '1 L', () => new THREE.Vector3(side / 2 + 1.2 + ref / 2, ref + 0.4, 0));
    addLabel('lbl-mol', `質量 ${fmtNum(num.mass)} g`, () => new THREE.Vector3(0, -0.6, 0));
    const h = Math.max(side / 2 - 0.45, 0.05);
    const paths = icons.map(() => ({ p: [r() * 2 - 1, r() * 2 - 1, r() * 2 - 1].map(v => v * h), v: randDir(r).map(v => v * (0.5 + r() * 0.6)), spin: r() * 2 }));
    const tri = (x, hh) => { const p = 4 * hh; const m = ((x + hh) % p + p) % p; return m < 2 * hh ? m - hh : 3 * hh - m; };
    view.tick = t => {
      icons.forEach((ic, i) => {
        const q = paths[i];
        ic.position.set(tri(q.p[0] + q.v[0] * t, h), side / 2 + tri(q.p[1] + q.v[1] * t, h), tri(q.p[2] + q.v[2] * t, h));
        ic.rotation.set(t * q.spin, t * 0.7 * q.spin, 0);
      });
    };
    view.moleExtent = Math.cbrt(5 * VM * 1000) / UNIT;
  } else {
    // 液体・固体：はかりの皿の上に積み上げる

// ===== カメラ =====
function sceneRadius() {
  const e = state.entry;
  if (view.kind === 'atom') return SHELL_R[Math.max(1, view.bohr.outer())] + 0.6;
  if (view.kind === 'demo') return e.demo === 'metal' ? 5.4 : e.demo === 'ionic' ? 5.2 : 2.7;
  if (view.kind === 'phase') return view.phaseInfo.H * 1.75;
  if (view.kind === 'ph') return 4.1;
  if (view.kind === 'sep') return view.sepR;
  if (view.kind === 'compare') return view.cmpR;
  if (view.kind === 'reaction') return view.rxTwo ? Math.max(view.rxWidth / 2 + 0.5, view.rxHeight / 2 + 0.5, 2.2) : Math.max(view.rxWidth / 2 + 0.8, view.rxHeight / 2 + 1.8, 3);
  if (view.kind === 'mole') return e.phase === 'gas' ? view.moleExtent * 0.9 + 1.5 : view.moleExtent;
  const m = e.model;
  let r = 0;
  m.pos.forEach(p => { r = Math.max(r, vlen(p) + (m.crystal ? 1.2 : 1.0)); });
  if (m.cell && m.cells === 1) r = Math.max(r, m.cell.a * 0.87);
  if (e.anim === 'dative') r = Math.max(r, 4.3);
  // 結晶（立方体）は、ななめから見ると球よりひとまわり小さく見えるので、少し大きめに映す
  if (m.crystal) r *= 0.8;
  return Math.max(r, 1.6);
}
function fitCamera() {
  onResize();
  const cam = R.camera;
  const stage = $('stage');
  const w = stage.clientWidth || 1, h = stage.clientHeight || 1;
  const sp = cardSpace();
  const wEff = Math.max(w - sp.x, w * 0.4), hEff = Math.max(h - sp.y - sp.top, h * 0.3);
  const tanV = Math.tan(cam.fov * Math.PI / 360);
  const halfV = Math.atan(tanV * hEff / h), halfH = Math.atan(tanV * wEff / h);
  const r = sceneRadius();
  view.fitR = r;
  const dist = r / Math.sin(Math.min(halfV, halfH)) * 1.05;
  const e = state.entry;
  let dir;
  if (view.kind === 'mole') dir = new THREE.Vector3(0.35, 0.45, 1);
  else if (view.kind === 'reaction') dir = new THREE.Vector3(0, 0.12, 1);
  else if (view.kind === 'phase') dir = new THREE.Vector3(0.55, 0.4, 1);
  else if (view.kind === 'ph') dir = new THREE.Vector3(0.15, 0.45, 1);
  else if (view.kind === 'sep') dir = new THREE.Vector3(0.12, 0.2, 1);
  else if (view.kind === 'compare') dir = new THREE.Vector3(0.15, 0.2, 1);
  else if (view.kind !== 'mol') dir = new THREE.Vector3(0, 0, 1);
  else if (e.model.crystal) dir = new THREE.Vector3(0.75, 0.5, 1);
  else dir = new THREE.Vector3(0.28, 0.22, 1);
  const target = new THREE.Vector3(0, 0, 0);
  if (view.kind === 'phase') target.set(0, view.phaseInfo.H, 0);
  if (view.kind === 'ph') target.set(0, 2.2, 0);
  if (view.kind === 'sep') target.copy(view.sepTarget);
  if (view.kind === 'mole') target.set(e.phase === 'gas' ? view.moleExtent * 0.2 : -2.2, e.phase === 'gas' ? view.moleExtent * 0.4 : 0.8, 0);
  cam.position.copy(dir.normalize().multiplyScalar(dist)).add(target);
  R.controls.target.copy(target);
  R.controls.update();
}

// ===== ラベルの位置 =====
function updateLabels() {
  const stage = $('stage');
  const w = stage.clientWidth, h = stage.clientHeight;
  const camPos = R.camera.position;
  view.labels.forEach(L => {
    if (L.el.hidden) return;
    const v = L.get();
    tmpV.copy(v).applyMatrix4(R.group.matrixWorld).project(R.camera);
    if (tmpV.z > 1) { L.el.style.visibility = 'hidden'; return; }
    L.el.style.visibility = '';
    L.el.style.transform = `translate(${((tmpV.x + 1) / 2 * w).toFixed(1)}px, ${((1 - tmpV.y) / 2 * h).toFixed(1)}px) translate(-50%, -50%)` + (sizes.lbl !== 1 ? ` scale(${sizes.lbl})` : '');
    if (L.atom >= 0) {
      // 手前の原子にかくれた原子のラベルは出さない
      const target = view.atoms[L.atom].position;
      tmpW.subVectors(target, camPos);
      const dist = tmpW.length();
      R.ray.set(camPos, tmpW.normalize());
      R.ray.far = dist;
      const hit = R.ray.intersectObjects(view.atoms, false)[0];
      if (hit && hit.object !== view.atoms[L.atom] && hit.distance < dist - atomRadius(L.atom) * 0.9) L.el.style.visibility = 'hidden';
      R.ray.far = Infinity;
    }
  });
}

let lastNow = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (!state.entry || !R) return;
  const dt = Math.min(0.1, (now - (lastNow || now)) / 1000);
  lastNow = now;
  const t = now / 1000;
  const e = state.entry;
  if (e.steps && state.demo.playing) {
    state.demo.tau += dt;
    if (state.demo.tau >= e.T) {
      if (e.demo === 'metal') { /* 自由電子は動き続ける */ } else { state.demo.tau = e.T; state.demo.playing = false; }
      syncDemoUI();
    } else if (Math.floor(state.demo.tau * 10) !== Math.floor((state.demo.tau - dt) * 10)) syncDemoUI();
  }
  if (view.grow < 1) {
    view.grow = Math.min(1, (now - view.growStart) / 450);
    R.group.scale.setScalar(0.75 + 0.25 * (1 - Math.pow(1 - view.grow, 3)));
  } else R.group.scale.setScalar(1);
  if (view.kind === 'mol') updatePositions(t);
  else if (view.tick) view.tick(view.kind === 'demo' ? state.demo.tau : t, t);
  R.controls.update();
  R.renderer.render(R.scene, R.camera);
  updateLabels();
  taTick();
}

// 原子をクリック／タップして選ぶ
function bindPicking() {
  const el = R.renderer.domElement;
  let down = null;
  el.addEventListener('pointerdown', ev => { down = { x: ev.clientX, y: ev.clientY }; });
  el.addEventListener('pointerup', ev => {
    if (!down || Math.hypot(ev.clientX - down.x, ev.clientY - down.y) > 6) { down = null; return; }
    down = null;
    if (view.kind !== 'mol') return;
    const rect = el.getBoundingClientRect();
    const ndc = new THREE.Vector2((ev.clientX - rect.left) / rect.width * 2 - 1, -((ev.clientY - rect.top) / rect.height) * 2 + 1);
    R.ray.setFromCamera(ndc, R.camera);
    const hit = R.ray.intersectObjects(view.atoms, false)[0];
    selectAtom(hit ? hit.object.userData.atom : -1);
  });
}
function selectAtom(i) {
  if (state.entry.kind === 'build') {

}

function setMole(n, from) {

  if (from !== 'range') $('moleRange').value = Math.min(5, state.mole.n);
  if (from !== 'input') $('moleVal').value = moleInputValue(e, state.mole.unit);
  if (R) { clearView(); buildMoleView(); }

function syncDemoUI() {
  const e = state.entry;
  if (!e || !e.steps) return;
  const s = $('scrub');
  if (s) s.value = Math.min(state.demo.tau, e.T);
  const btn = document.querySelector('#card [data-act="play"]');
  if (btn) btn.textContent = state.demo.playing ? '一時停止' : (state.demo.tau >= e.T && e.demo !== 'metal' ? 'もう一度' : '再生');
  let cur = 0;
  e.steps.forEach((st, i) => { if (state.demo.tau >= st[0]) cur = i; });
  document.querySelectorAll('#card .steps li').forEach((li, i) => {
    li.className = i === cur ? 'on' : i < cur ? 'done' : '';
  });
  const cap = $('caption');
  cap.textContent = e.steps[cur][1];
  cap.hidden = false;
}

// ===== 検索（分子式・名前） =====
function search(q) {
  const out = [];
  const s = q.trim();
  if (!s) return out;
  const low = s.toLowerCase();
  const cands = parseFormulaInput(s);
  const seen = new Set();
  cands.forEach(c => {
    LIB.filter(e => e.key && e.key === formulaKey(c.counts, c.charge)).forEach(e => { if (!seen.has(e.id)) { seen.add(e.id); out.push({ t: 'lib', e, why: '分子式が一致' }); } });
  });
  LIB.forEach(e => {
    if (seen.has(e.id)) return;
    const names = [e.name, e.en, ...(e.alias || []), ...(ALT_NAMES[e.id] || [])].filter(Boolean);
    if (names.some(n => n.toLowerCase().includes(low)) || (e.rational && e.rational.toLowerCase() === low.replace(/\s/g, '')) || (e.kind === 'atom' && e.el === s)) {
      seen.add(e.id); out.push({ t: 'lib', e, why: e.kind === 'atom' ? '原子' : '名前' });
    }
  });
  if (cands.length) {
    const c = cands[0];
    if (!out.some(r => r.why === '分子式が一致') && !(Object.keys(c.counts).length === 1 && Object.values(c.counts)[0] === 1)) {
      const mass = massOf(c.counts);
      if (c.charge) out.push({ t: 'msg', text: `${hillString(c.counts, c.charge)}：イオンの自動組み立てには対応していません（式量 ${fmtMass(mass.total)}）。` });
      else {
        const built = autoBuild(c.counts);
        if (built.error) out.push({ t: 'msg', text: `${hillString(c.counts, 0)}（分子量 ${fmtMass(mass.total)}）：${built.error}` });
        else out.push({ t: 'auto', counts: c.counts, built });
      }
    }
  }
  if (!out.length) out.push({ t: 'msg', text: '見つかりませんでした。元素記号は大文字・小文字を区別します（例: Cl, Na）。' });
  return out;
}
let lastResults = [];
function renderResults() {
  const q = $('q').value;
  const list = $('results');
  lastResults = search(q);
  if (!q.trim()) { list.hidden = true; list.innerHTML = ''; return; }
  list.innerHTML = lastResults.slice(0, 8).map((r, k) => {
    if (r.t === 'lib') return `<li><button type="button" data-r="${k}"><span class="r-f">${formulaHTML(displayFormula(r.e))}</span><span class="r-n">${esc(r.e.name)}</span><span class="r-tag">${r.why}</span></button></li>`;
    if (r.t === 'auto') return `<li><button type="button" class="r-auto" data-r="${k}"><span class="r-f">${formulaHTML(hillString(r.counts, 0))}</span><span class="r-n">分子式から立体を組み立てる</span><span class="r-tag">自動</span></button></li>`;
    return `<li><div><span class="r-msg">${esc(r.text)}</span></div></li>`;
  }).join('');
  list.hidden = false;
}
function openResult(r) {
  if (!r) return;

  else if (r.t === 'auto') {

      point: '同じ分子式でも、原子のつながり方がちがう別の物質（構造異性体）がありえます。ここに出ているのはその一例です。',

        ${hasDb ? `<div class="gfld"><input type="text" id="jCode" inputmode="numeric" maxlength="4" placeholder="部屋番号（4けた）"><input type="text" id="jName" maxlength="10" placeholder="ニックネーム" value="${esc(S.nick || '')}"></div>
        <div class="gfld"><button type="button" class="pbtn big" data-g="join">参加する ▶</button></div>
        <div class="gfld gteacher"><span class="note">先生</span><button type="button" class="pbtn ghost" data-g="mkroom">🏫 部屋をつくる</button></div>` : '<p class="warnbox">データベースが設定されていません。下の「先生の設定」で登録してください。</p>'}
        <details class="gset"><summary>先生の設定（データベース）</summary><p class="note">論理表現ラボと同じ Firebase Realtime Database を使います（空なら、はじめから入っているものを使う）。</p>
        <div class="gfld"><input type="text" id="dbUrl" placeholder="${DEFAULT_DB}" value="${esc(S.db || '')}"><button type="button" class="pbtn ghost" data-g="dbtest">保存して接続テスト</button></div></details></section></div>`;
  }

  /* ---------- クラス対戦（Firebase Realtime Database の REST ＋ ストリーム）
     rooms/mol{code} = { cfg, state: lobby|play|end, round, seed, startAt, players: { pid: { n, s, b, k, w, r, d } } } ---------- */
  function base() {
    const u = (S.db || DEFAULT_DB || '').trim().replace(/\/+$/, '');
    return /^https:\/\/[^\s]+$/.test(u) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?(\/|$)/.test(u) ? u : '';
  }
  function pid() { if (!S.pid) { S.pid = 'p' + Math.random().toString(36).slice(2, 10); save(); } return S.pid; }
  function api(method, path, body) {
    const o = { method };
    if (body !== undefined) o.body = JSON.stringify(body);
    return fetch(base() + '/' + path + '.json', o).then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
  function listen(path, cb) {
    let tree = null, es = null, poll = null, closed = false;
    const setAt = (p, val) => {
      const keys = p.split('/').filter(Boolean);
      if (!keys.length) { tree = val; return; }
      if (tree === null || typeof tree !== 'object') tree = {};
      let o = tree;
      for (let i = 0; i < keys.length - 1; i++) { if (o[keys[i]] == null || typeof o[keys[i]] !== 'object') o[keys[i]] = {}; o = o[keys[i]]; }
      if (val === null) delete o[keys[keys.length - 1]]; else o[keys[keys.length - 1]] = val;
    };
    const startPoll = () => { if (poll || closed) return; poll = setInterval(() => { api('GET', path).then(v => { tree = v; cb(tree); }, () => {}); }, 1500); };
    try {
      es = new EventSource(base() + '/' + path + '.json');
      es.addEventListener('put', e => { const d = JSON.parse(e.data); setAt(d.path, d.data); cb(tree); });
      es.addEventListener('patch', e => { const d = JSON.parse(e.data), p = d.path.replace(/\/$/, ''); Object.keys(d.data || {}).forEach(k => setAt(p + '/' + k, d.data[k])); cb(tree); });
      es.onerror = () => { if (es.readyState === 2) startPoll(); };
    } catch (e) { startPoll(); }
    return () => { closed = true; if (es) es.close(); clearInterval(poll); };
  }
  function syncClock(code) {
    const t0 = Date.now(), p = ROOM(code) + '/clock/' + pid();
    return api('PUT', p, { '.sv': 'timestamp' }).then(ts => { const t1 = Date.now(); if (typeof ts === 'number') OFF = ts - (t0 + t1) / 2; api('DELETE', p).catch(() => {}); }, () => {});
  }
  function joinUrl(code) {
    // 公開ページ・自分のサーバーで開いているならそのページ。claude.ai の中やファイルで開いているときは公開ページのリンクにする
    const here = /^https?:/.test(location.protocol) && !/claude\.ai$|claudeusercontent\.com$|anthropic\.com$/.test(location.hostname) ? location.origin + location.pathname : PUBLIC_URL;
    let u = here + '#join=' + code;
    if (S.db && base() !== DEFAULT_DB) u += '&db=' + encodeURIComponent(base());
    return u;
  }
  function playersOf(room, round) {
    const ps = (room && room.players) || {};
    return Object.keys(ps).map(k => Object.assign({ id: k }, ps[k])).filter(p => p && p.n && (round == null || p.r === round))
      .sort((a, b) => (round == null ? (b.b || 0) - (a.b || 0) : (b.s || 0) - (a.s || 0)));
  }

  /* 先生：部屋 */
  let H = null;
  function makeRoom() {
    const cfg = { r: 'fld', m: 'mix', u: '', t: 60, fig: 0, d3: 0, fx: 1, ex: 1, th: 'race' };
    const tryOne = n => {
      const code = String(1000 + Math.floor(Math.random() * 9000));
      return api('GET', ROOM(code)).then(v => {
        if (v && n < 6) return tryOne(n + 1);
        return api('PUT', ROOM(code), { cfg, state: 'lobby', round: 0, seed: 0, startAt: 0, host: pid(), created: { '.sv': 'timestamp' } })
          .then(() => { location.hash = '#host/' + code; });
      });
    };
    tryOne(0).catch(e => toast('部屋をつくれませんでした（' + e.message + '）。先生の設定を確認してください'));
  }
  function openHost(code) {
    H = { code, room: null, tab: 'now', ending: false, timer: null, stop: null };
    main.innerHTML = '<div class="ghost-host"><aside class="gpanel ghostL" id="hostL"></aside><section class="gpanel gboard" id="gBoard"><div class="gcount"><b>…</b></div></section></div>';
    syncClock(code).then(() => {
      if (!H || H.code !== code) return;
      H.stop = listen(ROOM(code), room => {
        if (!H) return;
        if (!room) { toast('この部屋は閉じられました'); location.hash = '#game'; return; }
        const first = !H.room; H.room = room;
        drawHostL(!first); drawBoard();
      });
      H.timer = setInterval(() => {
        if (!H || !H.room) return;
        const r = H.room;
        if (r.state === 'play' && now() > r.startAt + r.cfg.t * 1000 + 2500 && !H.ending) { H.ending = true; api('PATCH', ROOM(code), { state: 'end' }).then(() => { if (H) H.ending = false; }); }
        if (r.state === 'play') drawBoard();
      }, 250);
    });
  }
  function drawHostL(soft) {
    const r = H.room, el = $('hostL'); if (!el) return;
    const cfg = r.cfg, busy = r.state === 'play';
    const seg = (key, opts) => `<div class="seg wrap">${opts.map(o => `<button type="button" data-hc="${key}:${o[0]}" aria-pressed="${String(cfg[key]) === String(o[0])}"${busy ? ' disabled' : ''}>${o[1]}</button>`).join('')}</div>`;
    const qrOld = soft && $('gQr') ? $('gQr').innerHTML : '';
    const sc = el.querySelector('.gunits .gchk'), keepY = sc ? sc.scrollTop : 0, keepL = el.scrollTop;
    el.innerHTML = `<div class="groom"><small>部屋番号</small><div class="gcode">${H.code}</div></div><div class="gqr" id="gQr">${qrOld}</div>
      <p class="note">分子ラボ3D → 🎮 → 🏆 で 番号を入力<br>または QR を読みとる</p>
      ${rangeHTML(cfg, 'hc', busy, H.uc || 'kiso')}
      <p class="gnow">いまの設定：<b>${esc(cfgName(cfg))}</b></p>
      <div class="gfld"><span class="gppl">👥 <b>${playersOf(r).length}</b> 人</span><button type="button" class="pbtn big" data-g="hstart"${busy ? ' disabled' : ''}>${r.round ? `▶ 第${r.round + 1}回戦 スタート` : '▶ スタート'}</button></div>
      <div class="gfld"><button type="button" class="pbtn ghost" data-g="hcopy">🔗 参加リンクをコピー</button><button type="button" class="pbtn ghost" data-g="hclose">部屋を閉じる</button></div>`;
    const sc2 = el.querySelector('.gunits .gchk'); if (sc2) sc2.scrollTop = keepY; el.scrollTop = keepL;
    if (!qrOld) drawQR(joinUrl(H.code));
  }
  let qrLib = null;
  function drawQR(url) {
    const put = () => {
      const el = $('gQr'); if (!el || !window.qrcode) return;
      const q = window.qrcode(0, 'M'); q.addData(url); q.make();
      el.innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    };
    if (window.qrcode) { put(); return; }
    if (!qrLib) {
      qrLib = document.createElement('script');
      qrLib.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js'; // qrcode-generator 1.4.4（MIT）
      qrLib.onerror = () => { const el = $('gQr'); if (el) el.innerHTML = `<p class="note">QR を表示できませんでした。参加リンク：<br>${esc(url)}</p>`; };
      document.head.appendChild(qrLib);
    }
    qrLib.addEventListener('load', put);
  }
  function hostCfg(v) {
    const i = v.indexOf(':'), k = v.slice(0, i), val = v.slice(i + 1);
    if (k === 'uc') { H.uc = val; drawHostL(true); return; }
    const ch = rangeChange(H.room.cfg, k, val); if (!ch) return;
    Object.assign(H.room.cfg, ch); drawHostL(true); // すぐ画面に反映（データベースからの知らせも、あとで来る）
    api('PATCH', ROOM(H.code) + '/cfg', ch).catch(() => toast('変更できませんでした'));
  }
  function hostStart() {
    const r = H.room; if (!r || r.state === 'play') return;
    if (r.cfg.r === 'unit' && !unitList(r.cfg).length) { toast('単元をえらんでください'); return; }
    api('PATCH', ROOM(H.code), { state: 'play', round: (r.round || 0) + 1, seed: Math.floor(Math.random() * 1e9), startAt: Math.round(now() + 5000) }).catch(() => toast('スタートできませんでした'));
  }
  // ランキング表：広さを測って、列数・行数・文字の大きさを決める（40人でもスクロールなし）
  function rows(list, mode, W, Hh) {
    const top = Math.max(1, list.reduce((m, p) => Math.max(m, mode === 'best' ? p.b || 0 : p.s || 0), 0));
    let n = list.length, cols = n <= 10 ? 1 : n <= 24 ? 2 : 3, rowsN = n, more = 0, style = '';
    if (W && Hh) {
      cols = Math.max(1, Math.min(cols, Math.floor(W / 230)));
      const maxRows = Math.max(1, Math.floor(Hh / 24));
      rowsN = Math.ceil(n / cols);
      if (rowsN > maxRows) { rowsN = maxRows; more = n - (cols * rowsN - 1); list = list.slice(0, cols * rowsN - 1); }
      rowsN = Math.max(Math.min(8, maxRows), rowsN);
      const fs = Math.max(11, Math.min(26, Hh / rowsN * 0.55));
      style = ` style="grid-template-columns:repeat(${cols},minmax(0,1fr));grid-template-rows:repeat(${rowsN},minmax(0,1fr));font-size:${fs.toFixed(1)}px"`;
    }
    let rank = 0, last = -1;
    return `<ol class="grk"${style}>` + list.map((p, i) => {
      const v = mode === 'best' ? p.b || 0 : p.s || 0;
      if (v !== last) { rank = i + 1; last = v; }
      const medal = rank <= 3 && v > 0 ? ['🥇', '🥈', '🥉'][rank - 1] : rank;
      return `<li class="${rank <= 3 && v > 0 ? 'top top' + rank : ''}${p.id === pid() ? ' me' : ''}"><span class="rn">${medal}</span><span class="nm">${esc(p.n)}${mode !== 'best' && p.k >= 10 ? ` <i class="fire">🔥${p.k}</i>` : ''}</span>
        <span class="bar"><i style="width:${(v / top * 100).toFixed(1)}%"></i></span><span class="sc">${fmt(v)}</span></li>`;
    }).join('') + (more ? `<li class="more">…ほか ${more} 人</li>` : '') + '</ol>';
  }
  function drawBoard() {
    const el = $('gBoard'), r = H && H.room; if (!el || !r) return;
    const t = now(); let head, body, lst = null, lmode = 'now';
    const tabs = `<div class="gtabs"><button type="button" data-g="tab:now" aria-selected="${H.tab === 'now'}">今回</button><button type="button" data-g="tab:best" aria-selected="${H.tab === 'best'}">🏆 ハイスコア</button></div>`;
    if (H.tab === 'best') {
      head = `<div class="gbh"><b>🏆 この部屋のハイスコア</b>${tabs}</div>`;
      const bl = playersOf(r).filter(p => p.b > 0);
      if (bl.length) { lst = bl; lmode = 'best'; } else body = '<div class="gcount"><small>まだ記録がありません</small></div>';
    } else if (r.state === 'lobby' || !r.round) {
      const ps = playersOf(r);
      head = `<div class="gbh"><b>参加者を待っています</b>${tabs}</div>`;
      body = ps.length ? `<div class="gchips">${ps.map(p => `<span class="gchipn">${esc(p.n)}</span>`).join('')}</div>` : `<div class="gcount"><small>生徒が 部屋番号 ${H.code} で 入ってくると ここに名前が出ます</small></div>`;
    } else if (r.state === 'play' && t < r.startAt) {
      head = `<div class="gbh"><b>第${r.round}回戦　${esc(cfgName(r.cfg))}</b>${tabs}</div>`;
      body = `<div class="gcount"><b>${Math.max(1, Math.ceil((r.startAt - t) / 1000))}</b><small>まもなく スタート！</small></div>`;
    } else {
      lst = playersOf(r, r.round);
      const end = r.state === 'end', left = Math.max(0, r.startAt + r.cfg.t * 1000 - t);
      head = `<div class="gbh"><b>${end ? `🎉 第${r.round}回戦 結果発表` : `⏱ 残り ${Math.ceil(left / 1000)} 秒`}</b>${tabs}</div>` + (end ? '' : `<div class="gtbar host"><i style="width:${left / (r.cfg.t * 1000) * 100}%"${left < 10000 ? ' class="hurry"' : ''}></i></div>`);
      if (end && lst[0] && lst[0].s > 0) head += `<div class="gchamp">🥇 ${esc(lst[0].n)} さん　${fmt(lst[0].s)} 点</div>`;
      if (!lst.length) { lst = null; body = '<div class="gcount"><small>まだ だれも 答えていません</small></div>'; }
    }
    el.innerHTML = head + '<div class="gbb">' + (lst ? '' : body) + '</div>';
    if (lst) { const bb = el.querySelector('.gbb'); bb.innerHTML = rows(lst, lmode, bb.clientWidth, bb.clientHeight); }
  }

  /* 生徒：参加 */
  let B = null;
  function openJoin(code, db) {
    if (db) { S.db = db; save(); }
    main.innerHTML = `<div class="gwait"><p class="gh">🏆 クラス対戦に参加</p><p class="note">部屋番号</p>
      <input type="text" id="jCode" class="gbig" inputmode="numeric" maxlength="4" value="${esc(code || '')}" placeholder="0000">
      <input type="text" id="jName" maxlength="10" placeholder="ニックネーム（10文字まで）" value="${esc(S.nick || '')}">
      <p class="note">本名ではなく ニックネームでも OK。ランキングに表示されます</p>
      <div class="grow"><button type="button" class="pbtn big" data-g="join">参加する ▶</button><button type="button" class="pbtn ghost" data-g="hub">◀ もどる</button></div></div>`;
    if (code) { const n = $('jName'); if (n && !n.value) n.focus(); }
  }
  function join() {
    const code = ($('jCode').value || '').replace(/\D/g, ''), name = ($('jName').value || '').trim().slice(0, 10);
    if (code.length !== 4) { toast('部屋番号は 4 けたです'); return; }
    if (!name) { toast('ニックネームを入れてください'); return; }
    S.nick = name; save();
    const me = ROOM(code) + '/players/' + pid();
    api('GET', ROOM(code) + '/state').then(st => { if (!st) throw new Error('nf'); return api('GET', me); })
      .then(old => api('PATCH', me, { n: name, s: (old && old.s) || 0, b: (old && old.b) || 0, r: (old && old.r) || 0, k: 0 }))
      .then(() => syncClock(code))
      .then(() => {
        B = { code, room: null, played: 0, last: 0, push: null, awarded: {} };
        const r = rw(); r.battles = Math.max(r.battles, 1); save(); checkBadges();
        location.hash = '#battle/' + code;
      }).catch(e => toast(e.message === 'nf' ? `部屋 ${code} が見つかりません` : `つながりません（${e.message}）`));
  }
  function openBattle(code) {
    if (!B || B.code !== code) B = { code, room: null, played: 0, last: 0, push: null, awarded: {} };
    drawWait();
    syncClock(code).then(() => { if (B) B.stop = listen(ROOM(code), onRoom); });
  }
  function onRoom(room) {
    if (!B) return;
    if (!room) { toast('先生が部屋を閉じました'); location.hash = '#game'; return; }
    B.room = room;
    const me = room.players && room.players[pid()];
    if (!me) { location.hash = '#join=' + B.code; return; }
    if (room.state === 'play' && room.round !== B.played && now() < room.startAt + room.cfg.t * 1000 - 3000) {
      B.played = room.round;
      newGame(room.cfg, room.seed, 'battle', room.startAt);
      api('PATCH', ROOM(B.code) + '/players/' + pid(), { s: 0, k: 0, w: 0, r: room.round, d: 0 }).catch(() => {});
      playShell(`部屋 ${B.code}・第${room.round}回戦`);
      runClock(endBattle);
      return;
    }
    if (room.state === 'end' && B.played === room.round && !B.awarded[room.round]) {
      B.awarded[room.round] = 1;
      const lst = playersOf(room, room.round), my = lst.map(p => p.id).indexOf(pid());
      if (my >= 0 && my < 3 && lst[my].s > 0) { rw().top3++; earn(50); }
      save(); checkBadges();
    }
    if (!G || G.over) drawWait();
  }
  function pushScore(final) {
    if (!G || G.mode !== 'battle' || !B) return;
    const t = Date.now();
    if (!final && t - B.last < 600) { clearTimeout(B.push); B.push = setTimeout(() => pushScore(), 650); return; }
    B.last = t;
    const me = (B.room && B.room.players && B.room.players[pid()]) || {};
    api('PATCH', ROOM(B.code) + '/players/' + pid(), { s: G.score, k: G.combo, w: G.ok, r: B.played, b: Math.max(me.b || 0, G.score), d: final ? 1 : 0 }).catch(() => {});
  }
  function endBattle() {
    clearTimeout(B && B.push); pushScore(true);
    const coins = afterGame() + 20; save(); earn(coins);
    G.coins = coins;
    setTimeout(() => { stopScene(); drawWait(); }, 300);
  }
  function drawWait() {
    if (!B) return;
    const room = B.room;
    let mid;
    if (!room) mid = '<p class="gh">つないでいます…</p>';
    else if (room.state === 'play' && room.round !== B.played) mid = `<p class="gh">いま 第${room.round}回戦の最中です</p><p class="note">次の回から参加できます。少し待ってね</p>`;
    else if (B.played && room.round === B.played) {
      const lst = playersOf(room, room.round), my = lst.map(p => p.id).indexOf(pid()), meP = lst[my] || {}, fin = room.state === 'end';
      mid = `<p class="note">第${room.round}回戦 ${fin ? '結果' : '（集計中… みんなが終わるのを待っています）'}</p>
        <div class="gscore">${my + 1}<small> 位 / ${lst.length} 人</small></div>
        <p class="note">${fmt(meP.s || 0)} 点　✅ ${meP.w || 0} 問正解${G && G.coins ? `　🪙 +${G.coins}` : ''}</p>${rows(lst.slice(0, 5), 'now')}
        <p class="note">${fin ? '先生が 次のスタートをおすと 始まります' : ''}</p>${G && G.mode === 'battle' ? reviewHTML() : ''}`;
    } else mid = `<div class="gnew wait">参加中</div><p class="gh">${esc(S.nick || '')} さん、ようこそ！</p><p class="note">先生が スタートをおすと 3・2・1 で 全員いっせいに始まります</p>
      <div class="gchips">${playersOf(room).slice(0, 40).map(p => `<span class="gchipn${p.id === pid() ? ' me' : ''}">${esc(p.n)}</span>`).join('')}</div>`;
    main.innerHTML = `<div class="gwait"><div class="gwh"><button type="button" class="pbtn ghost" data-g="bleave">◀ ぬける</button><b>🏆 部屋 ${B.code}</b><span class="gppl">👥 ${room ? playersOf(room).length : 0} 人</span></div>${mid}</div>`;
  }

  /* ---------- 画面の切りかえ（#game・#ta・#join=1234・#host/1234・#battle/1234） ---------- */
  function leave() { stopScene(); if (G) { clearInterval(G.timer); clearTimeout(G.adv); G = null; } if (H) { clearInterval(H.timer); if (H.stop) H.stop(); H = null; } }
  function leaveBattle() { if (B) { if (B.stop) B.stop(); clearTimeout(B.push); B = null; } }
  function route(hash) {
    const h = decodeURIComponent((hash !== undefined ? hash : location.hash).slice(1));
    let m;
    if (h === 'game') { show(true); renderHub(); return true; }
    if (h === 'ta') { show(true); leave(); leaveBattle(); startSolo(); return true; }
    if ((m = h.match(/^join(?:=(\d*))?(?:&db=(.+))?$/))) { show(true); leave(); leaveBattle(); openJoin(m[1] || '', m[2] || ''); return true; }
    if ((m = h.match(/^host\/(\d{4})$/))) { show(true); leave(); leaveBattle(); if (!base()) { renderHub(); return true; } openHost(m[1]); return true; }
    if ((m = h.match(/^battle\/(\d{4})$/))) { show(true); leave(); if (!base()) { renderHub(); return true; } openBattle(m[1]); return true; }
    return false;
  }
  function onClick(e) {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    const d = b.dataset;
    if (d.gp != null && G) { pick(+d.gp); return; }
    if (d.ta) { const i = d.ta.indexOf(':'); soloRange(d.ta.slice(0, i), d.ta.slice(i + 1)); return; }
    if (d.hc) { hostCfg(d.hc); return; }
    const [a, arg] = (d.g || '').split(':');
    switch (a) {
      case 'close': close(); break;
      case 'hub': location.hash = '#game'; renderHub(); break;
      case 'solo': if (location.hash === '#ta') startSolo(); else location.hash = '#ta'; break;
      case 'again': startSolo(); break;
      case 'rv': if (G) { G.rv = arg; const el = $('gRev'); if (el) el.outerHTML = reviewHTML(); } break;
      case 'zukan': openZukan(); break;
      case 'sfx': S.sfx = S.sfx === false; save(); renderHub(); break;
      case 'next': advance(); break;
      case 'brag': brag((G && G.share) || ''); break;
      case 'quit': leave(); leaveBattle(); location.hash = '#game'; renderHub(); break;
      case 'rewards': openRewards(); break;
      case 'join': join(); break;
      case 'mkroom': makeRoom(); break;
      case 'hstart': hostStart(); break;
      case 'hcopy': { const u = joinUrl(H.code); if (navigator.clipboard) navigator.clipboard.writeText(u).then(() => toast('参加リンクをコピーしました'), () => toast(u)); else toast(u); break; }
      case 'hclose': if (confirm(`部屋 ${H.code} を閉じますか？（ランキングも消えます）`)) { const c = H.code; leave(); api('DELETE', ROOM(c)).then(() => { location.hash = '#game'; }, () => { location.hash = '#game'; }); } break;
      case 'tab': H.tab = arg; drawBoard(); break;
      case 'bleave': leaveBattle(); leave(); location.hash = '#game'; break;
      case 'dbtest': {
        const inp = $('dbUrl'); S.db = (inp ? inp.value : '').trim().replace(/\/+$/, ''); save();
        if (!base()) { toast('https:// で始まる URL を入れてください'); return; }
        const k = 'rooms/molping_' + pid();
        api('PUT', k, { t: { '.sv': 'timestamp' } }).then(() => api('DELETE', k)).then(() => { toast('✅ つながりました'); renderHub(); }, err => toast('✕ つながりません（' + err.message + '）'));
        break;
      }
    }
  }
  function init() {
    shell(); chip();
    const c = $('coinChip'); if (c) c.addEventListener('click', openRewards);
    const g = $('gameBtn'); if (g) g.addEventListener('click', () => { location.hash = '#game'; route(); });
    window.addEventListener('hashchange', () => { if (!route() && !root.hidden) { leave(); leaveBattle(); show(false); } });
    window.addEventListener('resize', () => { if (H) drawBoard(); });
    // 最初のリンクがゲームの画面なら、そこから始める（3Dの画面がリンクを書きかえていても）
    const h0 = window.__hash0 || '';
    if (/^#(game|ta|join|host\/|battle\/)/.test(h0)) { try { history.replaceState(null, '', h0); } catch (e) { /* 無視 */ } route(h0); }
    touchDay(); save();
  }
  // ほかの画面から呼ぶ：正解したらコイン、クイズ満点など
  return {
    init, earn, open: () => { location.hash = '#game'; route(); },
    full() { rw().full++; save(); checkBadges(); },
    check: checkBadges,
    sfxOff: () => S.sfx === false,
    _g: () => G, // テスト用
    _extra(t, n) { const out = []; for (let i = 0; i < n; i++) out.push(EXTRA[t]()); return out; },
    _sample(cfg, n) { const keep = G; G = { cfg, R: rng(7) }; const out = []; for (let i = 0; i < n; i++) out.push(seededQuestion(G.R, cfg)); G = keep; return out; }, // テスト用
  };
})();
GAME.init();
</script>
